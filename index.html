a:["ช่วงนี้คุณอาจใช้ชีวิตอยู่ในความคิดและหน้าที่เป็นส่วนใหญ่ ร่างกายเลยเหมือนพาหนะที่พาไปทำงานให้เสร็จ มากกว่าบ้านที่เราอยู่จริง ๆ","เวลาเร่งรีบนาน ๆ เรามักชินกับความเหนื่อยจนไม่รู้ตัวว่าเหนื่อย ไหล่ตึง หายใจตื้น หรือข้ามมื้ออาหารกลายเป็นเรื่องปกติ ไม่ใช่เพราะคุณไม่ใส่ใจ แต่เพราะชีวิตเรียกร้องจากเราเยอะ","ลองสังเกตดูว่า ร่างกายอาจพยายามบอกอะไรบางอย่างมาสักพักแล้ว"],
call:["อนุญาตให้ตัวเองพักก่อนที่จะหมดแรง","กลับมารู้สึกถึงลมหายใจและสัมผัสของร่างกายในแต่ละวัน","ดูแลความต้องการพื้นฐาน เช่น กิน นอน ขยับ ให้เป็นเรื่องสำคัญ"],

rt:["หลังตื่นนอน อย่าเพิ่งหยิบมือถือ วางมือบนท้องแล้วหายใจตามธรรมชาติ 5 รอบ สังเกตว่าร่างกายตื่นมาเป็นยังไง แล้วถามตัวเองว่า วันนี้ร่างกายอยากได้อะไรหนึ่งอย่าง","ระหว่างวัน ลุกยืน ปล่อยไหล่ลง หายใจออกยาว ๆ 3 ครั้ง แล้วถามว่าตอนนี้ฉันหิว กระหาย หรือเหนื่อยไหม","ก่อนนอน อาบน้ำอุ่นหรือล้างหน้าช้า ๆ สัมผัสไหล่และแขนเบา ๆ แล้วเขียนหนึ่งบรรทัดว่าวันนี้ร่างกายทำอะไรให้ฉันบ้าง"],
qn:["ถ้าร่างกายส่งข้อความมาหาฉันวันนี้ เขาจะเขียนว่าอะไร","ฉันชินกับความเหนื่อยแบบไหนจนเรียกมันว่าเรื่องปกติ","การพักแบบไหนที่ทำให้ร่างกายฉันรู้สึกปลอดภัยจริง ๆ"],

svc:["Home in the Body และกิจกรรม Somatic Listening: ช่วยให้กลับมารับรู้ร่างกายและฝึกอยู่กับตัวเอง"],womb:1},
{e:"💗",n:"กลับมาฟังหัวใจ",en:"Return to Heart",bg:"rgba(235,170,185,.34),rgba(245,215,200,.26)",

a:["ช่วงนี้คุณอาจคุ้นเคยกับการทำสิ่งที่ควรทำ ดูแลคนอื่น หรือพยายามให้ทุกอย่างเรียบร้อย จนบางทีตอบไม่ได้ทันทีว่าตัวเองรู้สึกยังไง","การปรับตัวเก่งเป็นความสามารถที่มีค่า แต่ถ้าทำนาน ๆ ความต้องการของเราอาจถูกวางไว้หลังสุดโดยไม่ทันรู้ตัว ไม่ได้เพราะคุณเห็นแก่ตัว แต่เพราะคุณใส่ใจคนอื่นมาก","ลองสังเกตดูว่า มีอะไรที่ใจอยากพูดมาสักพักแล้วหรือเปล่า"],
call:["ยอมรับความรู้สึกที่เกิดขึ้นจริง แม้ยังไม่รู้ว่าจะทำยังไงกับมัน","บอกความต้องการเล็ก ๆ ของตัวเองให้ชัดขึ้น","เลือกสิ่งที่สอดคล้องกับสิ่งสำคัญของเรา มากกว่าความคาดหวังของใคร"],
pr:[["ใจ","เขียนสามบรรทัดว่า ตอนนี้ฉันรู้สึก... เพราะ... และฉันอยากได้..."],["ใจ","ฝึกบอกความต้องการเล็ก ๆ หนึ่งอย่างกับใครสักคน เช่น ขอเวลาคิดดูก่อนนะ"],["กาย","วางมือบนอก หายใจช้า ๆ แล้วสังเกตว่าตรงนั้นรู้สึกแน่นหรือโล่ง"],["กาย","เดินช้า ๆ 5 นาทีโดยไม่ฟังอะไร ปล่อยให้ความรู้สึกที่ค้างอยู่ผ่านเข้ามา"],["จิตวิญญาณ","นั่งเงียบ ๆ แล้วถามตัวเองว่า ถ้าไม่มีใครคาดหวังอะไร ฉันอยากเลือกอะไร"]],
rt:["ก่อนเริ่มวัน นั่งลง วางมือบนอก หายใจตามธรรมชาติ 5 รอบ แล้วถามตัวเองว่าตอนนี้ใจฉันรู้สึกยังไง ตอบสั้น ๆ ในใจก็พอ","ระหว่างวัน หยุดสักครู่ แล้วเช็กว่าตอนนี้ฉันกำลังทำเพราะอยากทำ หรือเพราะควรทำ","ก่อนนอน เขียน 3–5 บรรทัดว่าวันนี้อะไรที่ฉันอยากพูดแต่ไม่ได้พูด และอะไรที่ฉันรู้สึกขอบคุณ"],
qn:["ถ้าไม่ต้องทำให้ใครสบายใจ วันนี้ฉันจะพูดอะไร","ความรู้สึกไหนที่ฉันเก็บไว้นานจนชินแล้ว","ตอนนี้ฉันกำลังใช้ชีวิตตามความคาดหวังของใครอยู่บ้าง"],
rm:"คุณไม่ต้องรู้คำตอบของทุกเรื่องในวันนี้ แค่ซื่อสัตย์กับความรู้สึกของตัวเองหนึ่งครั้ง ก็เป็นการกลับมาที่มีความหมายแล้ว",
svc:["Reset to Restart: Elemental Reading: สำรวจธรรมชาติภายใน ความต้องการ และแนวทางออกแบบชีวิตที่สอดคล้องกับตัวเอง"]},
{e:"🌳",n:"กลับมาเชื่อมโยงกับธรรมชาติ",en:"Return to Nature",bg:"rgba(150,190,130,.34),rgba(220,230,180,.26)",
core:"ธรรมชาติไม่จำเป็นต้องเป็นภูเขาหรือป่าไกล ๆ แค่แสงแดด ลม ต้นไม้ หรือการเดินแบบไม่รีบ ก็ช่วยให้เรากลับมาอยู่กับปัจจุบันได้",
a:["ช่วงนี้ชีวิตอาจอยู่กับหน้าจอ ตารางเวลา และความเร่งรีบ มากกว่าจังหวะที่เป็นธรรมชาติของตัวเอง","พอเป็นแบบนี้นาน ๆ ใจเราก็เหมือนไม่มีที่ให้พัก ไม่ใช่เพราะคุณขาดอะไร แต่เพราะสิ่งรอบตัวส่งสัญญาณมาตลอดเวลา","ลองสังเกตดูว่า ครั้งสุดท้ายที่ได้อยู่กับแสงหรือลมข้างนอกโดยไม่ต้องรีบทำอะไรคือเมื่อไร"],
call:["อนุญาตให้ชีวิตช้าลงตามจังหวะของวัน","ได้สัมผัสแสง ลม ต้นไม้ หรือน้ำ ด้วยประสาทสัมผัสจริง ๆ","เลือกความเรียบง่ายที่ช่วยให้ใจได้พัก"],
pr:[["กาย","ยืนหรือนั่งรับแสงเช้า 5–10 นาที โดยไม่ต้องทำอย่างอื่น"],["กาย","เดินเท้าเปล่าบนหญ้าหรือพื้นเย็น ๆ ถ้าปลอดภัย แล้วสังเกตสัมผัสใต้เท้า"],["ใจ","นั่งมองต้นไม้หนึ่งต้น 3 นาที สังเกตสีและการไหวของใบ"],["ใจ","ปิดหน้าจอหนึ่งช่วง เช่นตอนกินข้าว แล้วอยู่กับรสและกลิ่นของอาหาร"],["จิตวิญญาณ","ฟังเสียงรอบตัว 5 อย่าง แล้วขอบคุณหนึ่งสิ่งที่อยู่นอกหน้าต่าง"]],
rt:["หลังตื่นนอน เปิดหน้าต่างหรือออกไปหน้าบ้านสักนาที หายใจตามธรรมชาติ สังเกตแสง ลม และเสียง แล้วถามตัวเองว่าวันนี้อากาศรู้สึกยังไง","ระหว่างวัน มองออกไปไกล ๆ 1–3 นาที สังเกตสีหรือการเคลื่อนไหวของสิ่งเล็ก ๆ ข้างนอก ปล่อยไหล่ลง","ก่อนนอน หรี่ไฟสว่าง เปิดไฟอุ่น ๆ นั่งเงียบ 5 นาที แล้วเขียนหนึ่งบรรทัดว่าวันนี้ธรรมชาติให้อะไรฉันบ้าง"],
qn:["จังหวะของวันนี้ช้าเกินไปหรือเร็วเกินไปสำหรับฉัน","สิ่งเล็ก ๆ อะไรในธรรมชาติที่ทำให้ใจฉันนิ่งลงได้","ถ้าฉันออกไปอยู่ข้างนอกทุกวัน วันละ 10 นาที ชีวิตจะเปลี่ยนไปยังไง"],
rm:"คุณไม่ต้องไปไกลถึงภูเขาหรือป่า ใต้ต้นไม้ต้นเดียวหรือริมหน้าต่างก็เป็นธรรมชาติที่ช่วยได้แล้ว",
svc:["กิจกรรมดูแลตัวเองผ่านธรรมชาติ ประสาทสัมผัส และวิถีชีวิตเรียบง่ายของมะไหม","ทาง LINE OA มีเรียนออนไลน์ + ดาวน์โหลด Self care tool ฟรี"]},
{e:"🌅",n:"กลับมาเชื่อมโยงกับความหมายของชีวิต",en:"Return to Soul",bg:"rgba(250,190,130,.34),rgba(245,220,170,.26)",
core:"เราไม่จำเป็นต้องค้นพบภารกิจใหญ่ของชีวิตทันที บางครั้งการกลับไปทำสิ่งเล็ก ๆ ที่ทำให้รู้สึกมีชีวิตชีวา อาจเป็นจุดเริ่มต้นของการเข้าใจว่าเราอยากใช้ชีวิตแบบไหน",
a:["ช่วงนี้คุณอาจทำหลายอย่างได้ดี แต่เริ่มสงสัยว่าชีวิตที่กำลังสร้างอยู่ตรงกับสิ่งที่สำคัญสำหรับตัวเองหรือเปล่า","คำถามแบบนี้มักมาในช่วงที่เราผ่านอะไรมาเยอะ หรือเริ่มอิ่มกับสิ่งที่เคยตามหา ไม่ได้แปลว่าคุณมาผิดทาง แต่อาจแปลว่าบางส่วนในตัวคุณอยากได้คำตอบที่ลึกกว่าเดิม","ลองสังเกตดูว่า มีสิ่งเล็ก ๆ อะไรที่ทำแล้วใจตื่นขึ้นมา โดยไม่ต้องมีเหตุผลรองรับ"],
call:["กลับไปหาสิ่งเล็ก ๆ ที่ทำให้รู้สึกมีชีวิตชีวา แม้ยังไม่เห็นผลทันที","ลองถามว่าสิ่งสำคัญของฉันตอนนี้คืออะไร ไม่ใช่ของเมื่อห้าปีก่อน","เลือกก้าวเล็ก ๆ ที่สอดคล้องกับคุณค่าของตัวเอง"],
pr:[["กาย","เดินช้า ๆ 10 นาที แล้วสังเกตว่าตรงไหนในร่างกายรู้สึกเบาหรือตื่น"],["กาย","ทำสิ่งหนึ่งด้วยมือ เช่น วาด ทำอาหาร หรือปลูกต้นไม้เล็ก ๆ"],["ใจ","เขียนรายการสิ่งที่ทำให้ฉันลืมเวลา 5 อย่าง แล้วดูว่ามีอะไรซ้ำกัน"],["ใจ","เล่าให้คนที่ไว้ใจฟังว่า ช่วงนี้ฉันสงสัยอะไรในชีวิต"],["จิตวิญญาณ","นั่งเงียบ ๆ 5 นาที แล้วถามว่า ถ้าวันนี้เลือกได้หนึ่งอย่างที่มีความหมายกับฉัน จะเป็นอะไร"]],
rt:["ก่อนเปิดมือถือ นั่งลง หายใจตามธรรมชาติ 5 รอบ แล้วถามตัวเองว่า วันนี้อะไรคือสิ่งเล็ก ๆ ที่อยากให้มีความหมายกับฉัน","ระหว่างวัน หยุดสั้น ๆ แล้วถามว่าสิ่งที่ทำอยู่ตอนนี้ ใกล้หรือไกลจากสิ่งสำคัญของฉัน ไม่ต้องตัดสิน แค่สังเกต","ก่อนนอน เขียนสองบรรทัด บรรทัดแรกคือช่วงไหนของวันที่ใจฉันตื่น บรรทัดสองคือพรุ่งนี้อยากให้ช่วงแบบนั้นเกิดอีกยังไง"],
qn:["ถ้าไม่ต้องพิสูจน์ความสำเร็จกับใคร ฉันอยากสร้างชีวิตแบบไหน","สิ่งไหนที่ฉันเคยรักแต่ปล่อยทิ้งไป โดยไม่มีเหตุผลที่ชัดเจน","ถ้าชีวิตของฉันมีคำหนึ่งคำที่อยากให้เป็นเข็มทิศ คำนั้นคือคำว่าอะไร"],
rm:"คุณไม่ต้องรู้ภารกิจใหญ่ของชีวิตในวันนี้ แค่สังเกตว่าอะไรทำให้ใจตื่น แล้วให้เวลากับมันทีละนิด ก็เป็นการเดินกลับไปหารากแล้ว",
svc:["Reset to Restart: Elemental Reading: สำรวจตัวเอง จังหวะชีวิต คุณค่าที่สำคัญ และบทต่อไปที่อยากสร้าง"]}

rs:[
{e:"⚡",en:"Spark",th:"นักค้นพบประกายชีวิต",tag:"ใจคุณตื่นเมื่อได้เจอสิ่งใหม่ ๆ",bg:"rgba(250,205,100,.34),rgba(250,170,130,.26)",

signs:["รู้สึกเบื่อ เหมือนทุกวันเป็นวันเดิม","ทำตามตารางไปเรื่อย ๆ จนไม่เหลืออะไรให้ตื่นเต้น","อยากหนีไปไหนสักที่ แต่ไม่รู้จะไปทางไหน","สนใจสิ่งที่เคยชอบน้อยลง"],

msg:"คุณไม่ได้เบื่อชีวิตหรอก ใจคุณแค่อยากรู้อยากเห็นอีกสักหน่อย ไม่ต้องทิ้งชีวิตตอนนี้ไปผจญภัยไกล ๆ ก็ได้ แค่แง้มประตูบานเล็ก ๆ ให้อะไรใหม่เข้ามา"},

pr:["วันที่ 1: เลือกช่วงพัก 10 นาที แล้วไม่ทำอะไรที่ไม่จำเป็นเลย","วันที่ 2: อยู่กับธรรมชาติหรือริมหน้าต่างบานโปรด 10 นาที สังเกตแสง ลม หรือเสียง","วันที่ 3: เขียนสามบรรทัดว่าการพักแบบไหนช่วยให้ใจอุ่นขึ้น แล้วจองเวลานั้นไว้ในสัปดาห์หน้า"],

letters:[

["อะไรเป็นสิ่งที่ทำให้คุณมักจะไม่ได้เติบโตไปอย่างที่ใจต้องการ?",[["ยังไม่แน่ใจว่าตัวเองต้องการอะไร หรือกลัวเลือกผิดทาง",0],["คิดเยอะ วางแผนเยอะ แต่ยังไม่ได้เริ่มลงมือจริง ๆ",1],["ยึดติดกับวิธีเดิม ๆ หรือกลัวที่จะออกจากสิ่งที่คุ้นเคย",2],["ใช้พลังไปกับการดูแลสิ่งต่าง ๆ จนลืมดูแลตัวเอง",3]]],
["ถ้ามีใครสักคนสนับสนุนการเติบโตของคุณได้ คุณอยากให้เขาช่วยอะไร?",[["ช่วยให้ฉันมองเห็นตัวเองและทิศทางที่อยากเดินไปให้ชัดขึ้น",0],["ช่วยสนับสนุนให้ฉันกล้าลงมือและทำสิ่งที่ตั้งใจให้เกิดขึ้นจริง",1],["ช่วยเปิดมุมมองใหม่ ๆ และทำให้ฉันกล้าทดลองสิ่งที่แตกต่าง",2],["เป็นพื้นที่ที่ทำให้ฉันรู้สึกปลอดภัย ไม่ต้องรีบ และเติบโตในจังหวะของตัวเอง",3]]],
["ถ้าเปรียบชีวิตตอนนี้เป็นต้นไม้ คุณคิดว่าต้นไม้ของคุณต้องการอะไรมากที่สุด?",[["แสงแดดที่ช่วยให้มองเห็นทิศทางว่าจะเติบโตไปทางไหน",0],["พลังและแรงผลักดันที่จะทำให้กิ่งก้านเริ่มผลิใบ",1],["พื้นที่ให้รากและกิ่งก้านได้ขยายออกไปอย่างอิสระ",2],["น้ำและดินที่อุดมสมบูรณ์ เพื่อให้รากแข็งแรงและไม่ต้องฝืนเติบโต",3]]],
["ในช่วง 3 เดือนข้างหน้า คุณอยากให้ชีวิตเปลี่ยนแปลงไปอย่างไร?",[["อยากเห็นทิศทางที่ชัดขึ้น และรู้ว่ากำลังเลือกชีวิตแบบไหนให้ตัวเอง",0],["อยากเห็นตัวเองลงมือทำสิ่งที่เคยคิดไว้ และมีความก้าวหน้าจริง ๆ",1],["อยากมีประสบการณ์ใหม่ ๆ และค้นพบความเป็นไปได้ที่ไม่เคยคิดถึง",2],["อยากมีชีวิตที่สมดุลขึ้น มีแรงกายแรงใจ และไม่ละเลยความต้องการของตัวเอง",3]]],
["ถ้าวันนี้คุณเลือกทำสิ่งหนึ่งเพื่อสนับสนุนการเติบโตของตัวเองได้ คุณจะเลือกอะไร?",[["ใช้เวลาทบทวนความฝันและเขียนทิศทางชีวิตที่อยากเดินไป",0],["เริ่มทำสิ่งหนึ่งที่ผัดวันประกันพรุ่งมานาน",1],["ลองทำสิ่งใหม่ที่อยู่นอกเหนือจากกิจวัตรเดิม ๆ",2],["ให้เวลากับตัวเอง พักผ่อน และเติมพลังให้ชีวิตก่อน",3]]]
],
rs:[
{e:"☀️",en:"Vision",th:"เติบโตด้วยการมองเห็นทิศทาง",tag:"ใจคุณโตได้ดีเมื่อเห็นแสงอยู่ที่ปลายทาง",bg:"rgba(250,225,150,.40),rgba(215,235,200,.30)",
desc:"คุณเป็นเหมือนต้นไม้ที่โตได้ดีเมื่อรู้ว่าแสงอยู่ทางไหน พอเห็นทิศทางชัด ใจก็พร้อมเติบโตไปทางนั้นอย่างมั่นคง ช่วงนี้คุณอาจกำลังอยากรู้ให้ชัดว่าชีวิตแบบไหนที่เป็นของคุณจริง ๆ",
needs:"หัวใจของคุณต้องการความชัดเจนและความเข้าใจตัวเอง อยากรู้ว่ากำลังเดินไปไหน และชีวิตแบบไหนที่ต้องการจริง ๆ ไม่ใช่แบบที่ใครคาดหวัง พอได้เห็นภาพ แรงที่จะก้าวต่อมักตามมาเอง",
hold:"บางทีความกลัวเลือกผิดทางทำให้เรายืนมองอยู่นานกว่าที่ตั้งใจ หรือมีเสียงของคนอื่นดังจนฟังเสียงของตัวเองไม่ชัด นี่ไม่ใช่ความอ่อนแอเลย แค่ใจกำลังต้องการแสงสักหน่อยก่อนจะก้าว",
dir:"ลองกลับมาสำรวจคุณค่า ความต้องการ และความฝันของตัวเอง แล้วค่อย ๆ ร่างทิศทางที่สอดคล้องกับใจ ไม่ต้องเป็นแผนที่สมบูรณ์ แค่ทิศทางคร่าว ๆ ที่รู้สึกว่า “ใช่” ก็พอ",
small:["นั่งเงียบ ๆ 10 นาที แล้วเขียนว่าอยากให้ชีวิตปีหน้ารู้สึกอย่างไร","เขียนสามสิ่งที่ทำแล้วใจพองโต และสามสิ่งที่ทำแล้วใจเหนื่อย","เขียนว่า ถ้าไม่มีใครคาดหวังอะไรกับฉันเลย ฉันอยากเลือกอะไร","ตั้งชื่อให้ชีวิตช่วงนี้ เช่น “ฤดูแห่งการมองหาทาง”","คุยกับคนที่ไว้ใจสักคนว่าเขาเห็นอะไรดี ๆ ในตัวเรา"],
pr:["วันที่ 1: ใช้เวลา 10 นาทีเขียนความฝันหรือสิ่งที่อยากมีในชีวิต โดยไม่ต้องคิดว่าทำได้จริงไหม","วันที่ 2: ย้อนอ่านสิ่งที่เขียน แล้วขีดเส้นใต้สามคำที่ใจรู้สึกอุ่นที่สุด","วันที่ 3: เลือกหนึ่งคำจากนั้นมาเป็นเข็มทิศของช่วงนี้ แล้วเขียนว่าสัปดาห์นี้มีอะไรเล็ก ๆ ที่เดินไปทางนั้นได้"],
qn:["ถ้าไม่ต้องกลัวเลือกผิด ฉันอยากให้ชีวิตไปทางไหน","อะไรคือสิ่งที่ฉันไม่อยากสูญเสียไประหว่างที่เติบโต","ครั้งสุดท้ายที่ฉันรู้สึกว่า “ใช่” กับทางที่เลือกคือตอนไหน"],
msg:"คุณไม่ได้หลงทางหรอก แค่กำลังมองหาแสงที่ใช่ ต้นไม้บางต้นต้องใช้เวลาหันหาแสงก่อนจะโต และช่วงเวลานั้นก็สำคัญไม่แพ้ช่วงที่ผลิใบเลย ค่อย ๆ มองไปด้วยกันนะ",
svc:["Reset to Restart — Elemental Reading: สำหรับคนที่อยากเข้าใจธรรมชาติของตัวเองและมองเห็นทิศทางชีวิตให้ชัดขึ้น"],
inv:"ถ้าอยากมีคนช่วยมองธรรมชาติของตัวเองและทิศทางชีวิตให้ชัดขึ้น มะไหมมีพื้นที่ให้เรียนรู้ไปด้วยกัน"},
{e:"🌱",en:"Momentum",th:"เติบโตด้วยการลงมือทำ",tag:"ใจคุณโตเมื่อได้เห็นตัวเองก้าวไปข้างหน้า",bg:"rgba(190,225,160,.42),rgba(240,230,170,.30)",
desc:"คุณเป็นเหมือนต้นกล้าที่พร้อมแทงยอดเมื่อได้แรงผลักเล็ก ๆ ช่วงนี้คุณอาจรู้อยู่แล้วว่าอยากทำอะไร และกำลังรอจังหวะหรือแรงใจที่จะเริ่มจริงจังสักที",
needs:"หัวใจของคุณต้องการแรงขับเคลื่อน ความกล้า และความรู้สึกว่าตัวเองกำลังก้าวหน้า ไม่ใช่แค่คิดหรือวางแผนอยู่ตลอด ก้าวเล็ก ๆ ที่เกิดขึ้นจริงก็เติมพลังให้ใจได้มากแล้ว",
hold:"บางทีเราคิดและวางแผนเยอะจนรู้สึกว่ายังไม่พร้อมสักที หรือกลัวว่าจะทำได้ไม่ดีพอ เลยเก็บไว้ในหัวนานกว่าที่ตั้งใจ ไม่ได้แปลว่าขี้เกียจเลย บ่อยครั้งแค่เพราะสิ่งนั้นมีความหมายกับเรามาก",
dir:"เริ่มจากก้าวเล็กจนไม่น่ากลัว สร้างความต่อเนื่องทีละนิด และค่อย ๆ ฝึกเชื่อมั่นในตัวเองผ่านสิ่งที่ลงมือทำจริง",
small:["เลือกสิ่งที่เลื่อนมานานหนึ่งอย่าง แล้วทำแค่ 5 นาที","ตั้งเวลา 10 นาที แล้วลงมือทำโดยไม่ต้องให้เสร็จ","เขียนสิ่งที่ทำสำเร็จวันนี้สามอย่าง ไม่ว่าจะเล็กแค่ไหน","บอกเพื่อนสักคนว่าวันนี้ฉันจะเริ่มทำอะไร","แบ่งงานใหญ่เป็นขั้นเล็ก ๆ แล้วเลือกขั้นแรกที่เบาที่สุด"],
pr:["วันที่ 1: เลือกสิ่งที่อยากทำหนึ่งอย่าง แล้วลงมือแค่ 5 นาที ไม่ต้องให้เสร็จ","วันที่ 2: ทำต่ออีก 10 นาที แล้วสังเกตว่าใจรู้สึกอย่างไรตอนเริ่มกับตอนหยุด","วันที่ 3: เขียนสามบรรทัดว่าสองวันนี้ขยับไปได้แค่ไหน แล้วเลือกก้าวต่อไปหนึ่งก้าว"],
qn:["ถ้าวันนี้ทำได้แค่ก้าวที่เล็กที่สุด ฉันจะเริ่มจากอะไร","อะไรทำให้ฉันรู้สึกว่ายังไม่พร้อม และมันจริงแค่ไหน","ครั้งไหนที่ฉันเคยลงมือแล้วภูมิใจในตัวเอง"],
msg:"คุณไม่ต้องพร้อมร้อยเปอร์เซ็นต์ก่อนเริ่มหรอกนะ ต้นไม้ไม่เคยรอให้ฤดูกาลสมบูรณ์แบบก่อนจะผลิใบ แค่ก้าวเล็ก ๆ วันนี้ก็นับเป็นการเติบโตแล้ว และมะไหมเชื่อว่าคุณทำได้ในจังหวะของตัวเอง",
svc:["NOURISH: สำหรับคนที่อยากเรียนรู้วิธีดูแลและหล่อเลี้ยงตัวเองอย่างต่อเนื่อง ให้มีแรงลงมือไปได้ยาว ๆ"],
inv:"ถ้าอยากมีแรงลงมือทำไปพร้อมกับการดูแลตัวเองแบบไม่หมดไฟ มะไหมมีพื้นที่ให้เรียนรู้ไปด้วยกัน"},
{e:"🌿",en:"Expansion",th:"เติบโตด้วยการเปิดรับสิ่งใหม่",tag:"ใจคุณโตเมื่อได้ขยายกิ่งก้านไปหาสิ่งใหม่",bg:"rgba(170,220,200,.38),rgba(215,235,175,.30)",
desc:"คุณเป็นเหมือนเถาไม้ที่ชอบทอดยอดไปหาที่ใหม่ ๆ ใจคุณโตขึ้นเมื่อได้เรียนรู้ ได้ลอง และได้เห็นมุมที่ไม่เคยเห็น ช่วงนี้คุณอาจกำลังอยากมีพื้นที่ให้ตัวเองขยับขยายออกไป",
needs:"หัวใจของคุณต้องการอิสระ พื้นที่ทดลอง และโอกาสในการเรียนรู้ อยากขยายขอบเขตชีวิตและค้นพบความเป็นไปได้ใหม่ ๆ โดยไม่ต้องถูกจำกัดด้วยภาพเดิม ๆ",
hold:"บางทีเรายึดวิธีเดิมไว้เพราะมันปลอดภัย หรือกลัวว่าถ้าออกจากที่คุ้นเคยแล้วจะไม่มีที่ยืน หรือมีทางเลือกเยอะจนลองหลายอย่างโดยยังไม่ได้ลงรากกับอะไรเลย ซึ่งเป็นเรื่องธรรมดามาก",
dir:"เปิดรับประสบการณ์ใหม่แบบเบา ๆ ปรับมุมมอง และอนุญาตให้ตัวเองเปลี่ยนได้โดยไม่ต้องยึดติดกับภาพเดิม พร้อมสังเกตว่าสิ่งไหนที่ลองแล้วใจยังอยากอยู่กับมันต่อ",
small:["ลองเรียนรู้เรื่องใหม่ที่ไม่เกี่ยวกับงานสัก 15 นาที","ไปที่ที่ยังไม่เคยไป แม้จะอยู่ใกล้ ๆ ก็ได้","ลองทำสิ่งเดิมด้วยวิธีใหม่ เช่น ทำอาหารจานเดิมโดยเปลี่ยนวัตถุดิบ","คุยกับคนที่ใช้ชีวิตต่างจากเรา แล้วฟังมุมมองของเขา","เขียนรายการสิ่งที่อยากลอง 10 อย่าง ไม่ต้องรีบทำ"],
pr:["วันที่ 1: ลองทำสิ่งหนึ่งที่ไม่เคยทำในวันธรรมดา ขนาดเล็กไม่เกิน 15 นาที","วันที่ 2: อ่านหรือฟังเรื่องจากมุมมองที่ต่างจากเราหนึ่งเรื่อง แล้วจดสิ่งที่ทำให้คิดต่างไป","วันที่ 3: เขียนว่าสองวันนี้อะไรทำให้ใจตื่น แล้วเลือกหนึ่งอย่างที่อยากลองต่อ"],
qn:["ถ้าไม่ต้องอธิบายให้ใครฟัง ฉันอยากลองอะไร","อะไรที่ฉันยึดไว้เพียงเพราะมันคุ้นเคย","สิ่งใหม่ที่เคยลองแล้วเปลี่ยนมุมมองฉันคืออะไร"],
msg:"ใจที่อยากรู้อยากเห็นของคุณเป็นพลังที่งดงามมากเลยนะ ไม่ต้องทิ้งสิ่งที่มีเพื่อไปลองสิ่งใหม่ ต้นไม้ที่ขยายกิ่งก็ยังมีรากอยู่ที่เดิม ค่อย ๆ ขยายออกไปในจังหวะที่ใจสบายก็พอ",

{e:"✨",en:"Spiritual Capital",th:"ทุนทางจิตวิญญาณ",m:"ความหมายของชีวิต คุณค่าที่เชื่อ ความหวัง และสิ่งที่ใหญ่กว่าตัวเรา",h:"สิ่งที่ทำให้อยากลุกขึ้นมาในแต่ละวัน หรือคุณค่าที่ไม่อยากทิ้ง",n:"ก่อนนอน ถามตัวเองว่าวันนี้อะไรทำให้ใจรู้สึกมีความหมาย",c0:"นั่งเงียบ ๆ 3 นาที หรือจดสิ่งที่ไม่อยากเสียไปในชีวิต",c1:"ให้เวลากับสิ่งที่หล่อเลี้ยงใจ เช่น ภาวนา เขียน เดินช้า ๆ",s:"เป็นกำลังใจให้คนใกล้ตัว หรือทำสิ่งเล็ก ๆ ตามคุณค่าของเรา"}

lv:[
{max:23,rg:"12–23",e:"🌰",en:"Seed in the Soil",th:"เมล็ดพันธุ์ใต้ดิน",k:"สิ่งดี ๆ อาจอยู่ตรงนั้นมานานแล้ว เพียงแต่ยังรอให้เราหยุดมอง",d:"ช่วงนี้คุณอาจยังมองทุนชีวิตไม่ชัด อาจเพราะเหนื่อยหรือกำลังรับมือกับเรื่องหนัก ไม่ได้แปลว่าไม่มีอะไรในชีวิต เหมือนเมล็ดพันธุ์ที่ยังอยู่ใต้ดิน",care:["เริ่มจากสังเกตสิ่งเล็ก ๆ วันละหนึ่งอย่าง เช่น อาหารมื้อนี้ ที่นั่งที่ได้พัก หรือคนที่ทักทาย","ให้ตัวเองได้พักก่อน การมองเห็นต้องใช้แรง ถ้ายังไม่มีแรง ก็เริ่มจากพักและไม่ต้องรีบ","เลือกทุนหนึ่งด้านที่รู้สึกง่ายที่สุด แล้วดูแลแค่ด้านเดียวก่อน"],ref:["ตอนนี้มีอะไรสักอย่างที่ช่วยให้ฉันผ่านวันนี้มาได้","ถ้าค่อย ๆ มองรอบตัว มีใครหรืออะไรที่ฉันเคยลืมไปว่าอยู่ตรงนั้นมาตลอด","ฉันอยากให้ตัวเองได้รับการดูแลแบบไหนในสัปดาห์นี้"],gr:["นั่งลงสบาย ๆ หายใจลึก 3 ครั้ง (1 นาที)","มองรอบตัว เลือกสิ่งของหรือผู้คนหนึ่งอย่างที่ช่วยคุณอยู่ (1 นาที)","เขียนหรือพูดว่า “ขอบคุณที่ช่วยฉันวันนี้” พร้อมบอกว่าช่วยอย่างไร (1–2 นาที)","วางมือที่หน้าอก แล้วขอบคุณตัวเองที่ยังเดินมาจนถึงวันนี้"],sh:"ยังไม่ต้องส่งต่อ ให้ตัวเองแข็งแรงก่อน แค่ยิ้มหรือขอบคุณใครสักคนก็พอ",msg:"คุณไม่ได้ผิดที่ยังมองไม่เห็น ค่อย ๆ ไปทีละนิดนะคะ เมล็ดพันธุ์ไม่ต้องรีบงอก"},
{max:32,rg:"24–32",e:"🌱",en:"Sprout Reaching for Light",th:"ต้นกล้าที่เริ่มเห็นแสง",k:"เริ่มสังเกตเห็นแล้ว และนั่นคือก้าวสำคัญ",d:"คุณเริ่มเห็นทุนชีวิตบางด้านแล้ว แต่ยังมีหลายด้านที่ผ่านไปเฉย ๆ คะแนนนี้ไม่ได้บอกว่ามีมากหรือน้อย แค่บอกว่าคุณกำลังเริ่มสังเกต",care:["เลือกทุนสองด้านที่เริ่มเห็นแล้ว และดูแลอย่างสม่ำเสมอ","จดสิ่งที่ได้รับ 1–3 อย่างทุกวัน ในสมุดหรือโน้ตโทรศัพท์","ชวนคนใกล้ตัวคุยว่าเขามองเห็นอะไรในตัวเรา เพราะบางทุนคนอื่นอาจมองเห็นก่อนเรา"],ref:["ด้านไหนที่ฉันเริ่มมองเห็นชัดขึ้นในช่วงนี้ และอะไรทำให้เห็น","มีอะไรที่ฉันเคยคิดว่าเป็นเรื่องธรรมดา แต่จริง ๆ แล้วมีค่ามาก","ถ้าให้เลือกดูแลทุนหนึ่งด้านก่อน ฉันจะเลือกด้านไหน เพราะอะไร"],gr:["หยุดพักหนึ่งนาที นึกถึงสามสิ่งที่ช่วยคุณในวันนี้ (คน สิ่งของ หรือธรรมชาติก็ได้)","เลือกหนึ่งอย่าง แล้วเขียนว่ามันช่วยคุณอย่างไร (2 นาที)","ขอบคุณสิ่งนั้นในใจ หรือส่งข้อความขอบคุณถึงคนนั้นถ้ารู้สึกอยาก (1–2 นาที)"],sh:"ลองส่งต่อเรื่องเล็ก ๆ เช่น แนะนำหนังสือหรือคนดี ๆ แบ่งอาหาร เท่าที่ไม่เหนื่อย",msg:"การเริ่มสังเกตคือก้าวสำคัญแล้วค่ะ ต้นกล้าแค่ได้แสงและน้ำสม่ำเสมอก็เติบโตได้"},
{max:41,rg:"33–41",e:"🌼",en:"Garden in Bloom",th:"สวนที่เริ่มเบ่งบาน",k:"เห็นแล้วว่าอะไรหล่อเลี้ยงเรา และพร้อมดูแลต่อ",d:"คุณเห็นทุนชีวิตหลายด้านและรู้ว่ามันหล่อเลี้ยงคุณอย่างไร นี่คือการมองเห็น ไม่ได้บอกว่าชีวิตดีกว่าใคร และเปลี่ยนได้เสมอ",care:["กำหนดช่วงเวลาสั้น ๆ ทุกสัปดาห์เพื่อดูแลทุนที่เห็นชัด เช่น นัดเพื่อน ทบทวนความรู้ หรือเดินในธรรมชาติ","หมุนเวียนดูแลทีละด้าน ไม่ต้องทำครบทุกอย่างในวันเดียว","สังเกตด้านที่คะแนนต่ำกว่า แล้วเติมความสนใจให้เบา ๆ ไม่ใช่เร่งแก้"],ref:["ทุนด้านไหนที่ช่วยฉันมากที่สุดในปีนี้ และฉันได้ดูแลมันตอบแทนบ้างหรือยัง","มีด้านไหนที่ฉันอยากให้แข็งแรงขึ้นอีกนิด","อะไรคือสิ่งที่ฉันมีอยู่แล้ว ซึ่งอาจเป็นประโยชน์กับคนใกล้ตัว"],gr:["เลือกทุนชีวิตหนึ่งด้านที่ช่วยคุณมากที่สุดวันนี้ (1 นาที)","เขียนสามบรรทัดว่าอะไรบ้างที่ช่วย และช่วยอย่างไร (2 นาที)","กล่าวขอบคุณผู้คน ธรรมชาติ หรือตัวเอง (1 นาที)","เลือกการกระทำเล็ก ๆ หนึ่งอย่างเพื่อดูแลสิ่งนั้นต่อ"],sh:"ลองแบ่งปันเท่าที่เต็มใจ เช่น ชวนเพื่อนเรียนรู้ แบ่งประสบการณ์ หรือเป็นผู้ฟังที่ดี",msg:"สวนที่เบ่งบานก็ต้องการวันพัก ดูแลต่อไปทีละนิดในจังหวะของตัวเองนะคะ"},
{max:48,rg:"42–48",e:"🌾",en:"Harvest to Share",th:"ผลผลิตที่พร้อมแบ่งปัน",k:"มองเห็นคุณค่า และรู้ว่าจะดูแลหรือต่อยอดได้อย่างไร",d:"คุณเห็นทุนชีวิตชัดหลายด้านและรู้ว่าจะดูแลต่อยอดอย่างไร แต่คะแนนสูงไม่ได้แปลว่าดีกว่าใคร หรือไม่เหลืออะไรให้สำรวจ",care:["ดูแลตัวเองก่อนแบ่งปันให้ผู้อื่น การให้ที่ยั่งยืนมาจากความอิ่มเอม","เก็บบันทึกสิ่งที่ช่วยเรา ไว้เป็นเครื่องมือในวันที่ทุนบางด้านอ่อนล้า","ลองสำรวจด้านที่คะแนนต่ำที่สุดด้วยความอยากรู้ ไม่ใช่การตัดสินตัวเอง"],ref:["ฉันแบ่งปันสิ่งที่มีอย่างไรให้ไม่เบียดเบียนตัวเอง","มีด้านไหนที่ฉันยังมองข้ามอยู่ แม้จะรู้สึกว่าเห็นชัดแล้ว","ถ้าไม่ต้องพิสูจน์อะไร ฉันอยากใช้ทุนที่มีกับเรื่องอะไรมากที่สุด"],gr:["หยุดและหายใจ (1 นาที)","ไล่นึกถึงทุนชีวิตที่ช่วยคุณวันนี้ 3–5 อย่าง (1 นาที)","เลือกหนึ่งอย่างแล้วกล่าวขอบคุณอย่างเจาะจง (1 นาที)","ถามตัวเองว่าวันนี้จะแบ่งปันสิ่งเล็ก ๆ อะไรได้ โดยไม่เหนื่อยเกินไป (1–2 นาที)"],sh:"แบ่งปันแบบยั่งยืน เช่น ถ่ายทอดความรู้ เป็นกำลังใจ หรือสนับสนุนงานที่เชื่อ ตามกำลัง ไม่ต้องให้มากเพื่อพิสูจน์อะไร",msg:"การให้ที่งดงามมาจากใจที่อิ่ม ขอบคุณที่ใส่ใจ และอย่าลืมดูแลตัวเองด้วยนะคะ"}
],
inv:["ผู้คนหรือความสัมพันธ์ 3 อย่างที่คอยสนับสนุนฉัน","สิ่งของหรือทรัพยากร 3 อย่างที่ช่วยให้ชีวิตฉันดำเนินต่อไปได้","สิ่งที่ฉันมีในด้านการเงิน ซึ่งช่วยสร้างทางเลือกหรือความมั่นคงให้ชีวิต","สิ่งจากธรรมชาติ 3 อย่างที่หล่อเลี้ยงฉัน","ความรู้หรือทักษะ 3 อย่างที่ฉันมี","ประสบการณ์ 1 เรื่องที่ทำให้ฉันเติบโต","ภูมิปัญญาหรือสิ่งดี ๆ จากวัฒนธรรมที่ฉันอยากรักษาไว้","สิ่งที่ทำให้ชีวิตฉันมีความหมาย","ทุนชีวิต 1 ด้านที่ฉันอยากกลับมาดูแลมากขึ้น","สิ่งหนึ่งที่ฉันสามารถส่งต่อให้คนอื่นได้จากสิ่งที่ฉันมีอยู่แล้ว"],
daily:[["หยุดพักและสังเกตสิ่งรอบตัว","หายใจช้า ๆ สักสามครั้ง แล้วมองรอบตัวว่ามีอะไรกำลังช่วยเราอยู่"],["เลือกทุนชีวิต 1 ด้าน","เลือกหนึ่งในแปดด้านที่ได้รับการสนับสนุนในวันนี้ ไม่ต้องเลือกให้ครบทุกด้าน"],["เขียนว่าสิ่งนั้นช่วยหล่อเลี้ยงชีวิตอย่างไร","สั้น ๆ หนึ่งถึงสามบรรทัด เขียนจากสิ่งที่เกิดขึ้นจริง"],["กล่าวขอบคุณ","ขอบคุณตัวเอง ผู้คน ธรรมชาติ หรือสิ่งที่เกี่ยวข้อง จะพูดในใจหรือเขียนก็ได้"],["เลือกการกระทำเล็ก ๆ หนึ่งอย่าง","เพื่อดูแลหรือต่อยอดทุนชีวิตด้านนั้น เช่น ส่งข้อความ ดูแลต้นไม้ หรืออ่านหนึ่งหน้า"]],

qs:[
[0,"เคยมีใครรู้สึกดีขึ้น เพราะได้คุยหรือได้อยู่กับเราบ้างไหม ตอนนี้เรามองเห็นเรื่องนี้แค่ไหน?","ฝีมือเล็ก ๆ อย่างการฟังหรือการอยู่ข้าง ๆ ก็มีค่า"],
[1,"ของหรือพื้นที่ที่เรามี เช่น บ้าน เครื่องมือ หรือมุมเล็ก ๆ เรามองเห็นแค่ไหนว่าใช้ช่วยคนอื่นหรือใช้ร่วมกันได้?","ไม่ต้องมีของแพง ของธรรมดาก็แบ่งปันได้"],

ex:[
{t:"1. The Gift I Already Carry",n:"ของขวัญที่ฉันมีอยู่แล้ว",steps:["เขียนสิ่งที่เรามีอยู่แล้ว 3 อย่าง อาจเป็นความรู้ ความสามารถ ประสบการณ์ ความสัมพันธ์ หรือคุณสมบัติภายใน","หลังแต่ละอย่าง เขียนว่ามันอาจเป็นประโยชน์กับใครหรือสิ่งใดได้บ้าง","เลือกอย่างที่รู้สึกเบาที่สุด แล้วนึกถึงโอกาสที่จะใช้มันในสัปดาห์นี้"],ref:["ข้อไหนเขียนยากที่สุด และทำไม","มีอะไรที่คนอื่นเคยชมเรา แต่เรายังไม่ค่อยเชื่อ"],use:"เก็บรายการไว้ในโน้ตโทรศัพท์ แล้วเปิดดูในวันที่รู้สึกว่าตัวเองไม่มีอะไรจะให้",ph:["ของขวัญข้อ 1 และอาจเป็นประโยชน์กับใคร","ของขวัญข้อ 2 และอาจเป็นประโยชน์กับใคร","ของขวัญข้อ 3 และอาจเป็นประโยชน์กับใคร"]},
{t:"2. One Small Act of Giving",n:"การให้เล็ก ๆ หนึ่งอย่างใน 7 วัน",steps:["เช็กพลังงานของตัวเองวันนี้ แล้วเลือกระดับที่เหมาะ: <b>เบา</b> (ขอบคุณใครสักคน ส่งข้อความถามไถ่) · <b>กลาง</b> (ให้ยืมของ สอนสิ่งเล็ก ๆ ฟังใครสิบนาที) · <b>มีแรงมาก</b> (ช่วยงานชุมชน ปลูกต้นไม้ ชวนกลุ่มทำสิ่งดี ๆ)","เลือกการกระทำหนึ่งอย่างจากระดับนั้น แล้วกำหนดว่าจะทำเมื่อไหร่ภายใน 7 วัน","ทำเท่าที่ไหว ถ้าวันนั้นไม่ไหว เลื่อนหรือเปลี่ยนเป็นระดับที่เบากว่าได้เสมอ","หลังทำ จดสั้น ๆ ว่ารู้สึกอย่างไร"],ref:["หลังทำ ร่างกายและใจรู้สึกอย่างไร","มีอะไรที่ฉันได้รับกลับมาโดยไม่คาดคิด"],use:"เลือกการกระทำที่เป็นนิสัยได้ เช่น ทำสัปดาห์ละครั้ง โดยเริ่มจากระดับที่เบา",ph:["การกระทำที่ฉันเลือกและจะทำเมื่อไหร่","หลังทำแล้วฉันรู้สึกอย่างไร"]},
{t:"3. Receiving Is Part of Giving",n:"การรับก็เป็นส่วนหนึ่งของการให้",steps:["นึกถึงครั้งล่าสุดที่มีคนช่วยเรา แล้วสังเกตว่าเรารู้สึกอย่างไรกับการรับ (ขอบคุณ เกรงใจ อึดอัด ฯลฯ)","ถามตัวเองว่า ถ้าเป็นเพื่อนเราที่ได้รับความช่วยเหลือแบบนี้ เราจะรู้สึกอย่างไรกับเขา","ลองขอหรือรับความช่วยเหลือเล็ก ๆ หนึ่งอย่างในสัปดาห์นี้ แล้วบอกขอบคุณ"],ref:["ฉันรับความช่วยเหลือได้ง่ายหรือยาก และเพราะอะไร","การรับอย่างมีขอบเขตแปลว่าอะไรสำหรับฉัน"],use:"ผู้ให้ไม่จำเป็นต้องเป็นฝ่ายให้ตลอดเวลา การรับอย่างมีขอบเขตไม่ใช่ความเห็นแก่ตัว เมื่อเรารับได้ ความสัมพันธ์ก็เกื้อกันได้จริง",ph:["ครั้งล่าสุดที่มีคนช่วยฉัน และฉันรู้สึกอย่างไร","ความช่วยเหลือเล็ก ๆ ที่ฉันจะลองขอหรือรับ"]},
{t:"4. The Circle of Giving",n:"วงกลมของการให้",steps:["เขียนชื่อคนหรือสิ่งที่เกื้อหนุนเราอยู่ เช่น ครอบครัว เพื่อน ครู ชุมชน ธรรมชาติ","เขียนสิ่งเล็ก ๆ ที่เราอาจส่งต่อให้คนหรือสิ่งอื่นในวงกว้าง (ไม่จำเป็นต้องส่งกลับให้คนเดิมในรูปแบบเดียวกัน)","เลือกหนึ่งอย่างที่ทำได้ในเดือนนี้"],ref:["การดูแลที่ฉันได้รับ ไหลมาจากใครบ้าง","ฉันอยากให้การดูแลนั้นไหลต่อไปที่ไหน"],use:"การให้และการรับหมุนเวียนกันเป็นวงกลม ไม่ใช่หนี้บุญคุณ ที่ต้องตอบแทนคนเดิมเสมอไป",ph:["คนหรือสิ่งที่เกื้อหนุนฉัน","สิ่งที่ฉันอาจส่งต่อให้ผู้คน ชุมชน หรือธรรมชาติ","สิ่งเล็ก ๆ ที่ฉันจะทำในเดือนนี้"]}
],
vw:["คุณค่าของชีวิตมีหลายมิติ ไม่ได้มีเพียงรายได้หรือสถานะทางสังคม","สิ่งที่เรามีอาจเป็นทุนชีวิต แม้เราจะไม่เคยเรียกมันด้วยชื่อนี้","ทุนชีวิตบางอย่างเกิดจากสิ่งที่ได้รับ และบางอย่างเกิดจากสิ่งที่เราเรียนรู้และลงแรงพัฒนา","เราไม่ต้องรอให้พร้อมทุกด้านจึงจะเริ่มสร้างประโยชน์ได้","การให้เกิดได้หลายรูปแบบ ตามกำลังและขอบเขตของแต่ละคน","การแบ่งปันไม่ใช่การสูญเสียคุณค่า และการเก็บทรัพยากรไว้ดูแลตัวเองก็ไม่ใช่ความเห็นแก่ตัว","โลกขับเคลื่อนด้วยความสัมพันธ์และการพึ่งพาอาศัยกัน ไม่ใช่การแข่งขันหรือเงินอย่างเดียว","เราเรียนรู้จากทั้งการให้และการรับ โดยไม่ต้องคาดหวังผลตอบแทนที่เท่ากันทันที","การสร้างคุณค่าให้โลกไม่ต้องเป็นภารกิจยิ่งใหญ่ อาจเป็นสิ่งเล็ก ๆ ที่ทำสม่ำเสมอและสอดคล้องกับคุณค่าของเรา","เราเติบโตต่อไปได้ พร้อมกับเห็นคุณค่าของสิ่งที่มีอยู่แล้ว"],
svc:[["Reset to Restart","สำหรับคนที่เริ่มเห็นทุนชีวิตและศักยภาพของตัวเองแล้ว แต่อยากนำสิ่งเหล่านั้นมาทบทวนทิศทางชีวิต ออกแบบชีวิตบทใหม่ และค้นหาว่าอยากใช้สิ่งที่มีไปกับอะไร"],["Home in the Body","สำหรับคนที่อยากกลับมาเชื่อมโยงกับร่างกาย ฟังความรู้สึกภายใน และสร้างความสัมพันธ์กับตัวเองที่อ่อนโยนขึ้น เพื่อให้การเติบโตและการให้ไม่เกิดจากการฝืนตัวเอง"],["NOURISH","สำหรับคนที่อยากเรียนรู้การดูแลและหล่อเลี้ยงตัวเองให้ดีขึ้น เพื่อสร้างสมดุลระหว่างการให้ การรับ และการใช้ชีวิตประจำวัน"]]};
SETS.push(WORLDSET);
var HIDSET={id:"hidden",ic:"🎁",title:"HIDDEN TALENT",desc:"ค้นพบพรสวรรค์ที่อาจซ่อนอยู่ในตัวคุณ ผ่าน 10 มิติของธรรมชาติและความถนัด",hid:1,
unsure:"ยังไม่แน่ใจ / ยังไม่เคยสังเกตเรื่องนี้",
qs:[
["เมื่อได้ไปอยู่ในสถานที่ใหม่ ๆ สิ่งแรกที่คุณมักสนใจคืออะไร?",[["รายละเอียดเล็ก ๆ บรรยากาศ สีสัน หรือสิ่งที่แตกต่างจากที่อื่น",[0]],["ผู้คน ความรู้สึก และบรรยากาศระหว่างคนในสถานที่นั้น",[1]],["ความสัมพันธ์ของสิ่งต่าง ๆ และเรื่องราวที่อยู่เบื้องหลังสถานที่",[2,6]],["สิ่งที่น่าสนใจหรือประสบการณ์ใหม่ ๆ ที่อยากลองค้นพบ",[3,9]]]],
["เมื่อมีคนมาเล่าเรื่องที่กำลังเผชิญให้ฟัง คุณมักทำอะไรโดยธรรมชาติ?",[["สังเกตรายละเอียดหรือสิ่งที่เขาอาจยังไม่ได้พูดออกมา",[0]],["รับฟังและพยายามเข้าใจความรู้สึกของเขา",[1]],["ช่วยมองความเชื่อมโยงหรือสาเหตุของสิ่งที่เกิดขึ้น",[6,2]],["ชวนเขามองมุมใหม่หรือความเป็นไปได้อื่น ๆ",[4,3]]]],
["เมื่อเจอเรื่องซับซ้อนหรือมีข้อมูลหลายด้าน คุณมักจะ...",[["ค่อย ๆ แยกแยะรายละเอียดและตรวจสอบสิ่งที่ยังไม่ชัดเจน",[8,0]],["พยายามเข้าใจมุมมองและความรู้สึกของทุกฝ่าย",[1]],["เชื่อมโยงข้อมูลต่าง ๆ เพื่อมองเห็นภาพรวม",[2,7]],["ตั้งคำถาม ทดลองแนวคิด หรือค้นหาวิธีใหม่ในการทำความเข้าใจ",[3,6]]]],
["ถ้ามีเวลาว่างโดยไม่มีใครกำหนดว่าต้องทำอะไร คุณมักถูกดึงดูดไปหาอะไร?",[["สังเกตสิ่งรอบตัว เดินเล่น ชมธรรมชาติ หรือใส่ใจรายละเอียดเล็ก ๆ",[0]],["ใช้เวลากับผู้คน สัตว์ หรือสิ่งที่ทำให้รู้สึกเชื่อมโยง",[5,1]],["อ่าน ค้นคว้า เรียนรู้เรื่องใหม่ หรือเชื่อมโยงความคิดที่สนใจ",[3,2]],["สร้างสรรค์ผลงาน ทำอะไรด้วยจินตนาการ หรือทดลองสิ่งใหม่",[4,9]]]],
["เมื่อเห็นบางสิ่งที่ยังไม่สมบูรณ์ หรือน่าจะพัฒนาให้ดีขึ้นได้ คุณมัก...",[["มองเห็นรายละเอียดที่ยังขาดหรือจุดที่ควรปรับปรุง",[8,0]],["คิดถึงผลกระทบต่อผู้คนหรือสิ่งมีชีวิตที่เกี่ยวข้อง",[5,1]],["มองหาความเชื่อมโยงและวิธีทำให้สิ่งต่าง ๆ ลงตัวขึ้น",[2,8]],["เกิดไอเดียใหม่ ๆ และอยากลองสร้างสิ่งที่แตกต่าง",[9,4]]]],
["เมื่อผ่านเหตุการณ์สำคัญในชีวิต คุณมักทำอะไรกับประสบการณ์นั้น?",[["จดจำรายละเอียดและสังเกตว่ามีอะไรเปลี่ยนแปลงไปบ้าง",[0,6]],["ทบทวนความรู้สึกของตัวเองและความรู้สึกของคนที่เกี่ยวข้อง",[1,6]],["เชื่อมโยงเหตุการณ์กับประสบการณ์อื่นเพื่อทำความเข้าใจภาพใหญ่",[6,2]],["ตั้งคำถาม ค้นหาบทเรียน และความหมายที่ซ่อนอยู่",[3,6]]]],
["เมื่อมีความคิดหรือบางสิ่งที่อยากแบ่งปัน คุณมักแสดงออกอย่างไร?",[["ถ่ายทอดผ่านภาพ รายละเอียด หรือการสังเกตสิ่งที่คนอื่นอาจมองข้าม",[4,0]],["สื่อสารผ่านความรู้สึก การรับฟัง และการพูดคุยอย่างเข้าใจ",[1,7]],["เชื่อมโยงเรื่องราวหรือแนวคิดต่าง ๆ เพื่ออธิบายให้เห็นภาพ",[6,7]],["เล่าเรื่อง เขียน พูด หรือสร้างสรรค์วิธีถ่ายทอดที่เป็นตัวเอง",[7,4]]]],
["เมื่ออยากทำบางสิ่งให้เกิดขึ้นจริง คุณมักเริ่มต้นอย่างไร?",[["ศึกษารายละเอียดและทำความเข้าใจสิ่งที่เกี่ยวข้องก่อน",[3,8]],["พูดคุยกับผู้คนหรือมองหาความร่วมมือที่เหมาะสม",[7,1]],["วางภาพรวมและเชื่อมโยงสิ่งที่ต้องใช้เข้าด้วยกัน",[8,2]],["ทดลองลงมือทำ เรียนรู้ระหว่างทาง และค้นหาวิธีของตัวเอง",[9,3]]]],
["เมื่อต้องดูแลหรือพัฒนาบางสิ่งให้เติบโตในระยะยาว คุณมัก...",[["สังเกตความเปลี่ยนแปลงและรายละเอียดอย่างสม่ำเสมอ",[0,8]],["ใส่ใจความต้องการและสร้างสภาพแวดล้อมที่เอื้อต่อการเติบโต",[5,1]],["มองเห็นความสัมพันธ์และปรับองค์ประกอบต่าง ๆ ให้สอดคล้องกัน",[2,5]],["วางแผน จัดระบบ และค่อย ๆ พัฒนาให้เกิดความต่อเนื่อง",[8]]]],
["ถ้ามีโอกาสเริ่มชีวิตบทใหม่โดยไม่ต้องทำตามความคาดหวังของใคร คุณอยาก...",[["ใช้ชีวิตให้ช้าลงและเปิดโอกาสให้ตัวเองสังเกตโลกอย่างลึกซึ้ง",[6,0]],["สร้างความสัมพันธ์และพื้นที่ที่ผู้คนรู้สึกเป็นตัวเองได้",[5,1]],["เรียนรู้และค้นหาความเชื่อมโยงของสิ่งที่มีความหมายกับชีวิต",[2,3]],["สร้างสรรค์สิ่งใหม่ เริ่มต้นเส้นทางหรือโครงการที่เป็นของตัวเอง",[9,4]]]],
["เมื่อมีเรื่องดี ๆ หรือบทเรียนจากชีวิตที่อยากส่งต่อให้คนอื่น คุณมักทำอย่างไร?",[["เล่าเป็นเรื่องราวให้คนฟังเห็นภาพ",[7,1]],["ทำออกมาเป็นผลงาน เช่น ภาพ งานเขียน หรือสิ่งประดิษฐ์",[4,7]],["ค่อย ๆ ทบทวนให้ตกผลึกก่อน แล้วจึงแบ่งปัน",[6,0]],["ชวนคนอื่นมาลองทำหรือเริ่มทำไปด้วยกัน",[9,5]]]],
["เมื่อมีไอเดียหรือแรงบันดาลใจก้อนใหม่เข้ามา คุณมักทำอะไรต่อ?",[["จดหรือเล่าให้คนใกล้ตัวฟังก่อน เพื่อให้ไอเดียชัดขึ้น",[7,1]],["ลองลงมือทำเป็นต้นแบบเล็ก ๆ ในแบบของตัวเอง",[4,9]],["ดูว่าไอเดียนั้นช่วยดูแลหรือเกื้อกูลใครได้บ้าง",[5,1]],["เริ่มก้าวแรกทันที ก่อนที่ใจจะเปลี่ยน",[9,3]]]]
],

dd:{
V:{b:["ตอนนี้สิ่งที่ใจให้ค่าอาจยังไม่ชัดมาก ซึ่งเป็นจุดเริ่มต้นที่ซื่อตรงและเปลี่ยนได้","คุณเห็นสิ่งที่ให้ค่าอยู่บ้าง และบางเรื่องอาจยังปนกับสิ่งที่คนรอบตัวคาดหวัง","คุณค่อนข้างเห็นว่าอะไรสำคัญกับคุณ และใช้เป็นเข็มทิศตัดสินใจได้"]},
L:{b:["ภาพชีวิตที่อยากมีอาจยังเบลอ ซึ่งไม่ได้แปลว่าไม่มีเป้าหมาย การยังไม่รู้ก็เป็นจุดเริ่มต้นที่ดี","คุณเห็นภาพทิศทางบางส่วน และกำลังค่อย ๆ ชัดขึ้น","คุณเห็นภาพชีวิตที่อยากสร้างค่อนข้างชัด"]},
Y:{b:["จังหวะชีวิตของคุณอาจยังเรียนรู้อยู่ ซึ่งบางทีก็ขึ้นกับสถานการณ์ที่เลือกเองไม่ได้","คุณรู้จักจังหวะของตัวเองบางส่วนและปรับได้ในบางด้าน","ชีวิตที่คุณอยากมีค่อนข้างเข้ากับจังหวะและความต้องการของตัวเอง"]},
R:{b:["ตอนนี้ทุนในชีวิตที่คุณมองเห็นอาจยังน้อย ซึ่งอาจเป็นเพราะยังไม่ได้มองหา หรือเพราะสถานการณ์จริงที่หนักอยู่ ไม่ได้ตัดสินว่าคุณมีน้อยหรือมาก","คุณมองเห็นทุนในชีวิตอยู่หลายอย่าง และยังมีอีกบางด้านที่อยากเติม","คุณมองเห็นทุนที่ชีวิตมีและขอบคุณมันได้ค่อนข้างชัด"]},
C:{b:["ตอนนี้ยังไม่ชัดว่าอยากสร้างหรือแบ่งปันอะไร ซึ่งไม่ผิดเลย บางช่วงชีวิตเราอยู่กับการดูแลตัวเองก่อน","คุณเริ่มเห็นสิ่งที่อยากแบ่งปันหรือสร้างบางอย่างแล้ว","คุณเห็นแล้วว่ามีสิ่งที่อยากสร้างหรือแบ่งปัน และน่าจะลองได้ในหลายรูปแบบ"]}
},
