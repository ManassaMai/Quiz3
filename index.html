a:["ช่วงนี้คุณอาจใช้ชีวิตอยู่ในความคิดและหน้าที่เป็นส่วนใหญ่ ร่างกายเลยเหมือนพาหนะที่พาไปทำงานให้เสร็จ มากกว่าบ้านที่เราอยู่จริง ๆ","เวลาเร่งรีบนาน ๆ เรามักชินกับความเหนื่อยจนไม่รู้ตัวว่าเหนื่อย ไหล่ตึง หายใจตื้น หรือข้ามมื้ออาหารกลายเป็นเรื่องปกติ ไม่ใช่เพราะคุณไม่ใส่ใจ แต่เพราะชีวิตเรียกร้องจากเราเยอะ","ลองสังเกตดูว่า ร่างกายอาจพยายามบอกอะไรบางอย่างมาสักพักแล้ว"],
call:["อนุญาตให้ตัวเองพักก่อนที่จะหมดแรง","กลับมารู้สึกถึงลมหายใจและสัมผัสของร่างกายในแต่ละวัน","ดูแลความต้องการพื้นฐาน เช่น กิน นอน ขยับ ให้เป็นเรื่องสำคัญ"],

rt:["หลังตื่นนอน อย่าเพิ่งหยิบมือถือ วางมือบนท้องแล้วหายใจตามธรรมชาติ 5 รอบ สังเกตว่าร่างกายตื่นมาเป็นยังไง แล้วถามตัวเองว่า วันนี้ร่างกายอยากได้อะไรหนึ่งอย่าง","ระหว่างวัน ลุกยืน ปล่อยไหล่ลง หายใจออกยาว ๆ 3 ครั้ง แล้วถามว่าตอนนี้ฉันหิว กระหาย หรือเหนื่อยไหม","ก่อนนอน อาบน้ำอุ่นหรือล้างหน้าช้า ๆ สัมผัสไหล่และแขนเบา ๆ แล้วเขียนหนึ่งบรรทัดว่าวันนี้ร่างกายทำอะไรให้ฉันบ้าง"],
qn:["ถ้าร่างกายส่งข้อความมาหาฉันวันนี้ เขาจะเขียนว่าอะไร","ฉันชินกับความเหนื่อยแบบไหนจนเรียกมันว่าเรื่องปกติ","การพักแบบไหนที่ทำให้ร่างกายฉันรู้สึกปลอดภัยจริง ๆ"],

svc:["Home in the Body และกิจกรรม Somatic Listening: ช่วยให้กลับมารับรู้ร่างกายและฝึกอยู่กับตัวเอง"],womb:1},
{e:"💗",n:"กลับมาฟังหัวใจ",en:"Return to Heart",bg:"rgba(235,170,185,.34),rgba(245,215,200,.26)",

a:["ช่วงนี้คุณอาจคุ้นเคยกับการทำสิ่งที่ควรทำ ดูแลคนอื่น หรือพยายามให้ทุกอย่างเรียบร้อย จนบางทีตอบไม่ได้ทันทีว่าตัวเองรู้สึกยังไง","การปรับตัวเก่งเป็นความสามารถที่มีค่า แต่ถ้าทำนาน ๆ ความต้องการของเราอาจถูกวางไว้หลังสุดโดยไม่ทันรู้ตัว ไม่ได้เพราะคุณเห็นแก่ตัว แต่เพราะคุณใส่ใจคนอื่นมาก","ลองสังเกตดูว่า มีอะไรที่ใจอยากพูดมาสักพักแล้วหรือเปล่า"],
call:["ยอมรับความรู้สึกที่เกิดขึ้นจริง แม้ยังไม่รู้ว่าจะทำยังไงกับมัน","บอกความต้องการเล็ก ๆ ของตัวเองให้ชัดขึ้น","เลือกสิ่งที่สอดคล้องกับสิ่งสำคัญของเรา มากกว่าความคาดหวังของใคร"],
pr:[["ใจ","เขียนสามบรรทัดว่า ตอนนี้ฉันรู้สึก... เพราะ... และฉันอยากได้..."],["ใจ","ฝึกบอกความต้องการเล็ก ๆ หนึ่งอย่างกับใครสักคน เช่น ขอเวลาคิดดูก่อนนะ"],["กาย","วางมือบนอก หายใจช้า ๆ แล้วสังเกตว่าตรงนั้นรู้สึกแน่นหรือโล่ง"],["กาย","เดินช้า ๆ 5 นาทีโดยไม่ฟังอะไร ปล่อยให้ความรู้สึกที่ค้างอยู่ผ่านเข้ามา"],["จิตวิญญาณ","นั่งเงียบ ๆ แล้วถามตัวเองว่า ถ้าไม่มีใครคาดหวังอะไร ฉันอยากเลือกอะไร"]],
rt:["ก่อนเริ่มวัน นั่งลง วางมือบนอก หายใจตามธรรมชาติ 5 รอบ แล้วถามตัวเองว่าตอนนี้ใจฉันรู้สึกยังไง ตอบสั้น ๆ ในใจก็พอ","ระหว่างวัน หยุดสักครู่ แล้วเช็กว่าตอนนี้ฉันกำลังทำเพราะอยากทำ หรือเพราะควรทำ","ก่อนนอน เขียน 3–5 บรรทัดว่าวันนี้อะไรที่ฉันอยากพูดแต่ไม่ได้พูด และอะไรที่ฉันรู้สึกขอบคุณ"],
qn:["ถ้าไม่ต้องทำให้ใครสบายใจ วันนี้ฉันจะพูดอะไร","ความรู้สึกไหนที่ฉันเก็บไว้นานจนชินแล้ว","ตอนนี้ฉันกำลังใช้ชีวิตตามความคาดหวังของใครอยู่บ้าง"],
rm:"คุณไม่ต้องรู้คำตอบของทุกเรื่องในวันนี้ แค่ซื่อสัตย์กับความรู้สึกของตัวเองหนึ่งครั้ง ก็เป็นการกลับมาที่มีความหมายแล้ว",
svc:["Reset to Restart: Elemental Reading: สำรวจธรรมชาติภายใน ความต้องการ และแนวทางออกแบบชีวิตที่สอดคล้องกับตัวเอง"]},
{e:"🌳",n:"กลับมาเชื่อมโยงกับธรรมชาติ",en:"Return to Nature",bg:"rgba(150,190,130,.34),rgba(220,230,180,.26)",
core:"ธรรมชาติไม่จำเป็นต้องเป็นภูเขาหรือป่าไกล ๆ แค่แสงแดด ลม ต้นไม้ หรือการเดินแบบไม่รีบ ก็ช่วยให้เรากลับมาอยู่กับปัจจุบันได้",
a:["ช่วงนี้ชีวิตอาจอยู่กับหน้าจอ ตารางเวลา และความเร่งรีบ มากกว่าจังหวะที่เป็นธรรมชาติของตัวเอง","พอเป็นแบบนี้นาน ๆ ใจเราก็เหมือนไม่มีที่ให้พัก ไม่ใช่เพราะคุณขาดอะไร แต่เพราะสิ่งรอบตัวส่งสัญญาณมาตลอดเวลา","ลองสังเกตดูว่า ครั้งสุดท้ายที่ได้อยู่กับแสงหรือลมข้างนอกโดยไม่ต้องรีบทำอะไรคือเมื่อไร"],
call:["อนุญาตให้ชีวิตช้าลงตามจังหวะของวัน","ได้สัมผัสแสง ลม ต้นไม้ หรือน้ำ ด้วยประสาทสัมผัสจริง ๆ","เลือกความเรียบง่ายที่ช่วยให้ใจได้พัก"],
pr:[["กาย","ยืนหรือนั่งรับแสงเช้า 5–10 นาที โดยไม่ต้องทำอย่างอื่น"],["กาย","เดินเท้าเปล่าบนหญ้าหรือพื้นเย็น ๆ ถ้าปลอดภัย แล้วสังเกตสัมผัสใต้เท้า"],["ใจ","นั่งมองต้นไม้หนึ่งต้น 3 นาที สังเกตสีและการไหวของใบ"],["ใจ","ปิดหน้าจอหนึ่งช่วง เช่นตอนกินข้าว แล้วอยู่กับรสและกลิ่นของอาหาร"],["จิตวิญญาณ","ฟังเสียงรอบตัว 5 อย่าง แล้วขอบคุณหนึ่งสิ่งที่อยู่นอกหน้าต่าง"]],
rt:["หลังตื่นนอน เปิดหน้าต่างหรือออกไปหน้าบ้านสักนาที หายใจตามธรรมชาติ สังเกตแสง ลม และเสียง แล้วถามตัวเองว่าวันนี้อากาศรู้สึกยังไง","ระหว่างวัน มองออกไปไกล ๆ 1–3 นาที สังเกตสีหรือการเคลื่อนไหวของสิ่งเล็ก ๆ ข้างนอก ปล่อยไหล่ลง","ก่อนนอน หรี่ไฟสว่าง เปิดไฟอุ่น ๆ นั่งเงียบ 5 นาที แล้วเขียนหนึ่งบรรทัดว่าวันนี้ธรรมชาติให้อะไรฉันบ้าง"],
qn:["จังหวะของวันนี้ช้าเกินไปหรือเร็วเกินไปสำหรับฉัน","สิ่งเล็ก ๆ อะไรในธรรมชาติที่ทำให้ใจฉันนิ่งลงได้","ถ้าฉันออกไปอยู่ข้างนอกทุกวัน วันละ 10 นาที ชีวิตจะเปลี่ยนไปยังไง"],
rm:"คุณไม่ต้องไปไกลถึงภูเขาหรือป่า ใต้ต้นไม้ต้นเดียวหรือริมหน้าต่างก็เป็นธรรมชาติที่ช่วยได้แล้ว",
svc:["กิจกรรมดูแลตัวเองผ่านธรรมชาติ ประสาทสัมผัส และวิถีชีวิตเรียบง่ายของมะไหม","ทาง LINE OA มีเรียนออนไลน์ + ดาวน์โหลด Self care tool ฟรี"]},
{e:"🌅",n:"กลับมาเชื่อมโยงกับความหมายของชีวิต",en:"Return to Soul",bg:"rgba(250,190,130,.34),rgba(245,220,170,.26)",
core:"เราไม่จำเป็นต้องค้นพบภารกิจใหญ่ของชีวิตทันที บางครั้งการกลับไปทำสิ่งเล็ก ๆ ที่ทำให้รู้สึกมีชีวิตชีวา อาจเป็นจุดเริ่มต้นของการเข้าใจว่าเราอยากใช้ชีวิตแบบไหน",
a:["ช่วงนี้คุณอาจทำหลายอย่างได้ดี แต่เริ่มสงสัยว่าชีวิตที่กำลังสร้างอยู่ตรงกับสิ่งที่สำคัญสำหรับตัวเองหรือเปล่า","คำถามแบบนี้มักมาในช่วงที่เราผ่านอะไรมาเยอะ หรือเริ่มอิ่มกับสิ่งที่เคยตามหา ไม่ได้แปลว่าคุณมาผิดทาง แต่อาจแปลว่าบางส่วนในตัวคุณอยากได้คำตอบที่ลึกกว่าเดิม","ลองสังเกตดูว่า มีสิ่งเล็ก ๆ อะไรที่ทำแล้วใจตื่นขึ้นมา โดยไม่ต้องมีเหตุผลรองรับ"],
call:["กลับไปหาสิ่งเล็ก ๆ ที่ทำให้รู้สึกมีชีวิตชีวา แม้ยังไม่เห็นผลทันที","ลองถามว่าสิ่งสำคัญของฉันตอนนี้คืออะไร ไม่ใช่ของเมื่อห้าปีก่อน","เลือกก้าวเล็ก ๆ ที่สอดคล้องกับคุณค่าของตัวเอง"],
pr:[["กาย","เดินช้า ๆ 10 นาที แล้วสังเกตว่าตรงไหนในร่างกายรู้สึกเบาหรือตื่น"],["กาย","ทำสิ่งหนึ่งด้วยมือ เช่น วาด ทำอาหาร หรือปลูกต้นไม้เล็ก ๆ"],["ใจ","เขียนรายการสิ่งที่ทำให้ฉันลืมเวลา 5 อย่าง แล้วดูว่ามีอะไรซ้ำกัน"],["ใจ","เล่าให้คนที่ไว้ใจฟังว่า ช่วงนี้ฉันสงสัยอะไรในชีวิต"],["จิตวิญญาณ","นั่งเงียบ ๆ 5 นาที แล้วถามว่า ถ้าวันนี้เลือกได้หนึ่งอย่างที่มีความหมายกับฉัน จะเป็นอะไร"]],
rt:["ก่อนเปิดมือถือ นั่งลง หายใจตามธรรมชาติ 5 รอบ แล้วถามตัวเองว่า วันนี้อะไรคือสิ่งเล็ก ๆ ที่อยากให้มีความหมายกับฉัน","ระหว่างวัน หยุดสั้น ๆ แล้วถามว่าสิ่งที่ทำอยู่ตอนนี้ ใกล้หรือไกลจากสิ่งสำคัญของฉัน ไม่ต้องตัดสิน แค่สังเกต","ก่อนนอน เขียนสองบรรทัด บรรทัดแรกคือช่วงไหนของวันที่ใจฉันตื่น บรรทัดสองคือพรุ่งนี้อยากให้ช่วงแบบนั้นเกิดอีกยังไง"],
qn:["ถ้าไม่ต้องพิสูจน์ความสำเร็จกับใคร ฉันอยากสร้างชีวิตแบบไหน","สิ่งไหนที่ฉันเคยรักแต่ปล่อยทิ้งไป โดยไม่มีเหตุผลที่ชัดเจน","ถ้าชีวิตของฉันมีคำหนึ่งคำที่อยากให้เป็นเข็มทิศ คำนั้นคือคำว่าอะไร"],
rm:"คุณไม่ต้องรู้ภารกิจใหญ่ของชีวิตในวันนี้ แค่สังเกตว่าอะไรทำให้ใจตื่น แล้วให้เวลากับมันทีละนิด ก็เป็นการเดินกลับไปหารากแล้ว",
svc:["Reset to Restart: Elemental Reading: สำรวจตัวเอง จังหวะชีวิต คุณค่าที่สำคัญ และบทต่อไปที่อยากสร้าง"]}

rs:[
{e:"⚡",en:"Spark",th:"นักค้นพบประกายชีวิต",tag:"ใจคุณตื่นเมื่อได้เจอสิ่งใหม่ ๆ",bg:"rgba(250,205,100,.34),rgba(250,170,130,.26)",

signs:["รู้สึกเบื่อ เหมือนทุกวันเป็นวันเดิม","ทำตามตารางไปเรื่อย ๆ จนไม่เหลืออะไรให้ตื่นเต้น","อยากหนีไปไหนสักที่ แต่ไม่รู้จะไปทางไหน","สนใจสิ่งที่เคยชอบน้อยลง"],

msg:"คุณไม่ได้เบื่อชีวิตหรอก ใจคุณแค่อยากรู้อยากเห็นอีกสักหน่อย ไม่ต้องทิ้งชีวิตตอนนี้ไปผจญภัยไกล ๆ ก็ได้ แค่แง้มประตูบานเล็ก ๆ ให้อะไรใหม่เข้ามา"},

pr:["วันที่ 1: เลือกช่วงพัก 10 นาที แล้วไม่ทำอะไรที่ไม่จำเป็นเลย","วันที่ 2: อยู่กับธรรมชาติหรือริมหน้าต่างบานโปรด 10 นาที สังเกตแสง ลม หรือเสียง","วันที่ 3: เขียนสามบรรทัดว่าการพักแบบไหนช่วยให้ใจอุ่นขึ้น แล้วจองเวลานั้นไว้ในสัปดาห์หน้า"],

letters:[

["อะไรเป็นสิ่งที่ทำให้คุณมักจะไม่ได้เติบโตไปอย่างที่ใจต้องการ?",[["ยังไม่แน่ใจว่าตัวเองต้องการอะไร หรือกลัวเลือกผิดทาง",0],["คิดเยอะ วางแผนเยอะ แต่ยังไม่ได้เริ่มลงมือจริง ๆ",1],["ยึดติดกับวิธีเดิม ๆ หรือกลัวที่จะออกจากสิ่งที่คุ้นเคย",2],["ใช้พลังไปกับการดูแลสิ่งต่าง ๆ จนลืมดูแลตัวเอง",3]]],
["ถ้ามีใครสักคนสนับสนุนการเติบโตของคุณได้ คุณอยากให้เขาช่วยอะไร?",[["ช่วยให้ฉันมองเห็นตัวเองและทิศทางที่อยากเดินไปให้ชัดขึ้น",0],["ช่วยสนับสนุนให้ฉันกล้าลงมือและทำสิ่งที่ตั้งใจให้เกิดขึ้นจริง",1],["ช่วยเปิดมุมมองใหม่ ๆ และทำให้ฉันกล้าทดลองสิ่งที่แตกต่าง",2],["เป็นพื้นที่ที่ทำให้ฉันรู้สึกปลอดภัย ไม่ต้องรีบ และเติบโตในจังหวะของตัวเอง",3]]],
["ถ้าเปรียบชีวิตตอนนี้เป็นต้นไม้ คุณคิดว่าต้นไม้ของคุณต้องการอะไรมากที่สุด?",[["แสงแดดที่ช่วยให้มองเห็นทิศทางว่าจะเติบโตไปทางไหน",0],["พลังและแรงผลักดันที่จะทำให้กิ่งก้านเริ่มผลิใบ",1],["พื้นที่ให้รากและกิ่งก้านได้ขยายออกไปอย่างอิสระ",2],["น้ำและดินที่อุดมสมบูรณ์ เพื่อให้รากแข็งแรงและไม่ต้องฝืนเติบโต",3]]],
["ในช่วง 3 เดือนข้างหน้า คุณอยากให้ชีวิตเปลี่ยนแปลงไปอย่างไร?",[["อยากเห็นทิศทางที่ชัดขึ้น และรู้ว่ากำลังเลือกชีวิตแบบไหนให้ตัวเอง",0],["อยากเห็นตัวเองลงมือทำสิ่งที่เคยคิดไว้ และมีความก้าวหน้าจริง ๆ",1],["อยากมีประสบการณ์ใหม่ ๆ และค้นพบความเป็นไปได้ที่ไม่เคยคิดถึง",2],["อยากมีชีวิตที่สมดุลขึ้น มีแรงกายแรงใจ และไม่ละเลยความต้องการของตัวเอง",3]]],
["ถ้าวันนี้คุณเลือกทำสิ่งหนึ่งเพื่อสนับสนุนการเติบโตของตัวเองได้ คุณจะเลือกอะไร?",[["ใช้เวลาทบทวนความฝันและเขียนทิศทางชีวิตที่อยากเดินไป",0],["เริ่มทำสิ่งหนึ่งที่ผัดวันประกันพรุ่งมานาน",1],["ลองทำสิ่งใหม่ที่อยู่นอกเหนือจากกิจวัตรเดิม ๆ",2],["ให้เวลากับตัวเอง พักผ่อน และเติมพลังให้ชีวิตก่อน",3]]]
],
rs:[
{e:"☀️",en:"Vision",th:"เติบโตด้วยการมองเห็นทิศทาง",tag:"ใจคุณโตได้ดีเมื่อเห็นแสงอยู่ที่ปลายทาง",bg:"rgba(250,225,150,.40),rgba(215,235,200,.30)",
desc:"คุณเป็นเหมือนต้นไม้ที่โตได้ดีเมื่อรู้ว่าแสงอยู่ทางไหน พอเห็นทิศทางชัด ใจก็พร้อมเติบโตไปทางนั้นอย่างมั่นคง ช่วงนี้คุณอาจกำลังอยากรู้ให้ชัดว่าชีวิตแบบไหนที่เป็นของคุณจริง ๆ",
needs:"หัวใจของคุณต้องการความชัดเจนและความเข้าใจตัวเอง อยากรู้ว่ากำลังเดินไปไหน และชีวิตแบบไหนที่ต้องการจริง ๆ ไม่ใช่แบบที่ใครคาดหวัง พอได้เห็นภาพ แรงที่จะก้าวต่อมักตามมาเอง",
hold:"บางทีความกลัวเลือกผิดทางทำให้เรายืนมองอยู่นานกว่าที่ตั้งใจ หรือมีเสียงของคนอื่นดังจนฟังเสียงของตัวเองไม่ชัด นี่ไม่ใช่ความอ่อนแอเลย แค่ใจกำลังต้องการแสงสักหน่อยก่อนจะก้าว",
dir:"ลองกลับมาสำรวจคุณค่า ความต้องการ และความฝันของตัวเอง แล้วค่อย ๆ ร่างทิศทางที่สอดคล้องกับใจ ไม่ต้องเป็นแผนที่สมบูรณ์ แค่ทิศทางคร่าว ๆ ที่รู้สึกว่า “ใช่” ก็พอ",
small:["นั่งเงียบ ๆ 10 นาที แล้วเขียนว่าอยากให้ชีวิตปีหน้ารู้สึกอย่างไร","เขียนสามสิ่งที่ทำแล้วใจพองโต และสามสิ่งที่ทำแล้วใจเหนื่อย","เขียนว่า ถ้าไม่มีใครคาดหวังอะไรกับฉันเลย ฉันอยากเลือกอะไร","ตั้งชื่อให้ชีวิตช่วงนี้ เช่น “ฤดูแห่งการมองหาทาง”","คุยกับคนที่ไว้ใจสักคนว่าเขาเห็นอะไรดี ๆ ในตัวเรา"],
pr:["วันที่ 1: ใช้เวลา 10 นาทีเขียนความฝันหรือสิ่งที่อยากมีในชีวิต โดยไม่ต้องคิดว่าทำได้จริงไหม","วันที่ 2: ย้อนอ่านสิ่งที่เขียน แล้วขีดเส้นใต้สามคำที่ใจรู้สึกอุ่นที่สุด","วันที่ 3: เลือกหนึ่งคำจากนั้นมาเป็นเข็มทิศของช่วงนี้ แล้วเขียนว่าสัปดาห์นี้มีอะไรเล็ก ๆ ที่เดินไปทางนั้นได้"],
qn:["ถ้าไม่ต้องกลัวเลือกผิด ฉันอยากให้ชีวิตไปทางไหน","อะไรคือสิ่งที่ฉันไม่อยากสูญเสียไประหว่างที่เติบโต","ครั้งสุดท้ายที่ฉันรู้สึกว่า “ใช่” กับทางที่เลือกคือตอนไหน"],
msg:"คุณไม่ได้หลงทางหรอก แค่กำลังมองหาแสงที่ใช่ ต้นไม้บางต้นต้องใช้เวลาหันหาแสงก่อนจะโต และช่วงเวลานั้นก็สำคัญไม่แพ้ช่วงที่ผลิใบเลย ค่อย ๆ มองไปด้วยกันนะ",
svc:["Reset to Restart — Elemental Reading: สำหรับคนที่อยากเข้าใจธรรมชาติของตัวเองและมองเห็นทิศทางชีวิตให้ชัดขึ้น"],
inv:"ถ้าอยากมีคนช่วยมองธรรมชาติของตัวเองและทิศทางชีวิตให้ชัดขึ้น มะไหมมีพื้นที่ให้เรียนรู้ไปด้วยกัน"},
{e:"🌱",en:"Momentum",th:"เติบโตด้วยการลงมือทำ",tag:"ใจคุณโตเมื่อได้เห็นตัวเองก้าวไปข้างหน้า",bg:"rgba(190,225,160,.42),rgba(240,230,170,.30)",
desc:"คุณเป็นเหมือนต้นกล้าที่พร้อมแทงยอดเมื่อได้แรงผลักเล็ก ๆ ช่วงนี้คุณอาจรู้อยู่แล้วว่าอยากทำอะไร และกำลังรอจังหวะหรือแรงใจที่จะเริ่มจริงจังสักที",
needs:"หัวใจของคุณต้องการแรงขับเคลื่อน ความกล้า และความรู้สึกว่าตัวเองกำลังก้าวหน้า ไม่ใช่แค่คิดหรือวางแผนอยู่ตลอด ก้าวเล็ก ๆ ที่เกิดขึ้นจริงก็เติมพลังให้ใจได้มากแล้ว",
hold:"บางทีเราคิดและวางแผนเยอะจนรู้สึกว่ายังไม่พร้อมสักที หรือกลัวว่าจะทำได้ไม่ดีพอ เลยเก็บไว้ในหัวนานกว่าที่ตั้งใจ ไม่ได้แปลว่าขี้เกียจเลย บ่อยครั้งแค่เพราะสิ่งนั้นมีความหมายกับเรามาก",
dir:"เริ่มจากก้าวเล็กจนไม่น่ากลัว สร้างความต่อเนื่องทีละนิด และค่อย ๆ ฝึกเชื่อมั่นในตัวเองผ่านสิ่งที่ลงมือทำจริง",
small:["เลือกสิ่งที่เลื่อนมานานหนึ่งอย่าง แล้วทำแค่ 5 นาที","ตั้งเวลา 10 นาที แล้วลงมือทำโดยไม่ต้องให้เสร็จ","เขียนสิ่งที่ทำสำเร็จวันนี้สามอย่าง ไม่ว่าจะเล็กแค่ไหน","บอกเพื่อนสักคนว่าวันนี้ฉันจะเริ่มทำอะไร","แบ่งงานใหญ่เป็นขั้นเล็ก ๆ แล้วเลือกขั้นแรกที่เบาที่สุด"],
pr:["วันที่ 1: เลือกสิ่งที่อยากทำหนึ่งอย่าง แล้วลงมือแค่ 5 นาที ไม่ต้องให้เสร็จ","วันที่ 2: ทำต่ออีก 10 นาที แล้วสังเกตว่าใจรู้สึกอย่างไรตอนเริ่มกับตอนหยุด","วันที่ 3: เขียนสามบรรทัดว่าสองวันนี้ขยับไปได้แค่ไหน แล้วเลือกก้าวต่อไปหนึ่งก้าว"],
qn:["ถ้าวันนี้ทำได้แค่ก้าวที่เล็กที่สุด ฉันจะเริ่มจากอะไร","อะไรทำให้ฉันรู้สึกว่ายังไม่พร้อม และมันจริงแค่ไหน","ครั้งไหนที่ฉันเคยลงมือแล้วภูมิใจในตัวเอง"],
msg:"คุณไม่ต้องพร้อมร้อยเปอร์เซ็นต์ก่อนเริ่มหรอกนะ ต้นไม้ไม่เคยรอให้ฤดูกาลสมบูรณ์แบบก่อนจะผลิใบ แค่ก้าวเล็ก ๆ วันนี้ก็นับเป็นการเติบโตแล้ว และมะไหมเชื่อว่าคุณทำได้ในจังหวะของตัวเอง",
svc:["NOURISH: สำหรับคนที่อยากเรียนรู้วิธีดูแลและหล่อเลี้ยงตัวเองอย่างต่อเนื่อง ให้มีแรงลงมือไปได้ยาว ๆ"],
inv:"ถ้าอยากมีแรงลงมือทำไปพร้อมกับการดูแลตัวเองแบบไม่หมดไฟ มะไหมมีพื้นที่ให้เรียนรู้ไปด้วยกัน"},
{e:"🌿",en:"Expansion",th:"เติบโตด้วยการเปิดรับสิ่งใหม่",tag:"ใจคุณโตเมื่อได้ขยายกิ่งก้านไปหาสิ่งใหม่",bg:"rgba(170,220,200,.38),rgba(215,235,175,.30)",
desc:"คุณเป็นเหมือนเถาไม้ที่ชอบทอดยอดไปหาที่ใหม่ ๆ ใจคุณโตขึ้นเมื่อได้เรียนรู้ ได้ลอง และได้เห็นมุมที่ไม่เคยเห็น ช่วงนี้คุณอาจกำลังอยากมีพื้นที่ให้ตัวเองขยับขยายออกไป",
needs:"หัวใจของคุณต้องการอิสระ พื้นที่ทดลอง และโอกาสในการเรียนรู้ อยากขยายขอบเขตชีวิตและค้นพบความเป็นไปได้ใหม่ ๆ โดยไม่ต้องถูกจำกัดด้วยภาพเดิม ๆ",
hold:"บางทีเรายึดวิธีเดิมไว้เพราะมันปลอดภัย หรือกลัวว่าถ้าออกจากที่คุ้นเคยแล้วจะไม่มีที่ยืน หรือมีทางเลือกเยอะจนลองหลายอย่างโดยยังไม่ได้ลงรากกับอะไรเลย ซึ่งเป็นเรื่องธรรมดามาก",
dir:"เปิดรับประสบการณ์ใหม่แบบเบา ๆ ปรับมุมมอง และอนุญาตให้ตัวเองเปลี่ยนได้โดยไม่ต้องยึดติดกับภาพเดิม พร้อมสังเกตว่าสิ่งไหนที่ลองแล้วใจยังอยากอยู่กับมันต่อ",
small:["ลองเรียนรู้เรื่องใหม่ที่ไม่เกี่ยวกับงานสัก 15 นาที","ไปที่ที่ยังไม่เคยไป แม้จะอยู่ใกล้ ๆ ก็ได้","ลองทำสิ่งเดิมด้วยวิธีใหม่ เช่น ทำอาหารจานเดิมโดยเปลี่ยนวัตถุดิบ","คุยกับคนที่ใช้ชีวิตต่างจากเรา แล้วฟังมุมมองของเขา","เขียนรายการสิ่งที่อยากลอง 10 อย่าง ไม่ต้องรีบทำ"],
pr:["วันที่ 1: ลองทำสิ่งหนึ่งที่ไม่เคยทำในวันธรรมดา ขนาดเล็กไม่เกิน 15 นาที","วันที่ 2: อ่านหรือฟังเรื่องจากมุมมองที่ต่างจากเราหนึ่งเรื่อง แล้วจดสิ่งที่ทำให้คิดต่างไป","วันที่ 3: เขียนว่าสองวันนี้อะไรทำให้ใจตื่น แล้วเลือกหนึ่งอย่างที่อยากลองต่อ"],
qn:["ถ้าไม่ต้องอธิบายให้ใครฟัง ฉันอยากลองอะไร","อะไรที่ฉันยึดไว้เพียงเพราะมันคุ้นเคย","สิ่งใหม่ที่เคยลองแล้วเปลี่ยนมุมมองฉันคืออะไร"],
msg:"ใจที่อยากรู้อยากเห็นของคุณเป็นพลังที่งดงามมากเลยนะ ไม่ต้องทิ้งสิ่งที่มีเพื่อไปลองสิ่งใหม่ ต้นไม้ที่ขยายกิ่งก็ยังมีรากอยู่ที่เดิม ค่อย ๆ ขยายออกไปในจังหวะที่ใจสบายก็พอ",
svc:["Reset to Restart — Elemental Reading: สำหรับคนที่อยากเข้าใจธรรมชาติของตัวเอง ให้การขยายออกไปมีเข็มทิศ","Home in the Body: สำหรับคนที่อยากกลับมาเชื่อมโยงกับร่างกาย เป็นฐานที่มั่นคงระหว่างลองสิ่งใหม่"],
inv:"ถ้าอยากลองสิ่งใหม่โดยยังมีที่ยึดเหนี่ยวใจ มะไหมมีพื้นที่ให้เรียนรู้ไปด้วยกัน"},
{e:"🌳",en:"Rooted Growth",th:"เติบโตจากรากที่แข็งแรง",tag:"ใจคุณโตได้ดีเมื่อรากได้รับการดูแล",bg:"rgba(225,195,155,.40),rgba(190,215,170,.30)",
desc:"คุณเป็นเหมือนต้นไม้ที่เติบโตแข็งแรงเมื่อรากได้น้ำและดินที่ดี ช่วงนี้คุณอาจกำลังอยากให้ชีวิตมั่นคงและลงตัวก่อน แล้วค่อยก้าวต่อโดยไม่ต้องฝืน",
needs:"หัวใจของคุณต้องการความมั่นคงภายใน การดูแลตัวเอง และสภาพแวดล้อมที่เกื้อหนุน ก่อนจะเติบโตไปสู่สิ่งใหม่ การพักและเติมพลังไม่ใช่การหยุดเติบโต แต่เป็นส่วนหนึ่งของมัน",
hold:"บางทีเราใช้พลังไปกับการดูแลคนอื่นหรือรับผิดชอบหลายอย่างจนลืมดูแลตัวเอง หรือรู้สึกว่าต้องโตให้ทันคนอื่นทั้งที่รากยังเหนื่อยอยู่ ไม่ได้แปลว่าคุณเติบโตช้าเลย แค่ตอนนี้รากต้องการน้ำก่อน",
dir:"กลับมาหล่อเลี้ยงร่างกายและจิตใจ สร้างรากฐานชีวิตที่ดี และเติบโตโดยไม่ต้องฝืนตัวเอง เมื่อรากแข็งแรง กิ่งก้านจะค่อย ๆ ขยายได้เองตามเวลา",
small:["จองเวลาพักสั้น ๆ ที่ไม่มีใครรบกวนอย่างน้อย 10 นาที","ดื่มน้ำอุ่นช้า ๆ แล้วสังเกตลมหายใจของตัวเอง","จัดมุมเล็ก ๆ ในบ้านให้รู้สึกสงบและปลอดภัย","บอกคนใกล้ตัวหนึ่งเรื่องที่ฉันอยากได้รับการสนับสนุน","เข้านอนเร็วกว่าปกติสักหนึ่งคืน"],
pr:["วันที่ 1: ให้เวลาตัวเอง 10 นาทีโดยไม่ต้องทำอะไรให้เกิดผล แค่พักและสังเกตว่าร่างกายต้องการอะไร","วันที่ 2: เลือกสิ่งเล็ก ๆ หนึ่งอย่างที่ดูแลร่างกาย เช่น อาหารอุ่น ๆ หรือการอาบน้ำอุ่น แล้วทำอย่างใส่ใจ","วันที่ 3: เขียนว่าสองวันนี้อะไรทำให้รากรู้สึกได้รับน้ำ แล้วเลือกทำซ้ำอีกหนึ่งอย่างในสัปดาห์นี้"],
qn:["ตอนนี้รากของฉันต้องการอะไรมากที่สุด","ฉันใช้พลังไปกับอะไรจนลืมดูแลตัวเอง","ใครหรืออะไรที่ทำให้ฉันรู้สึกปลอดภัยและเป็นตัวเองได้"],
msg:"คุณไม่ต้องโตเร็วกว่าใครเลยนะ ต้นไม้ใหญ่ที่แข็งแรงเริ่มจากรากที่ค่อย ๆ ลงลึกในที่ที่ไม่มีใครเห็น การได้พักและดูแลตัวเองก็เป็นการเติบโตแบบหนึ่งแล้ว มะไหมอยู่ตรงนี้ไปด้วยกันนะ",
svc:["Home in the Body: สำหรับคนที่อยากกลับมาเชื่อมโยงกับร่างกายและสร้างความสัมพันธ์ที่ดีกับตัวเอง","NOURISH: สำหรับคนที่อยากเรียนรู้วิธีดูแลและหล่อเลี้ยงตัวเองอย่างต่อเนื่อง"],
inv:"ถ้าอยากเรียนรู้ที่จะดูแลรากของตัวเองให้แข็งแรงอย่างอ่อนโยน มะไหมมีพื้นที่ให้เรียนรู้ไปด้วยกัน"}

 app.innerHTML='<div class="mute">'+S.ic+' '+S.title+'</div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+i+'"><i style="width:'+pct+'%"></i></div><div class="mute">ข้อ '+(i+1)+' จาก '+n+'</div><div class="q"><h2>'+esc(S.qs[i][1])+'</h2><div class="scale">'+btns+'</div><div class="ends"><span>ไม่เลย</span><span>เป็นประจำ</span></div></div><button class="btn ghost" id="back">'+(i>0?'ย้อนกลับ':'กลับไปเลือกชุด')+'</button>';
 var bs=app.querySelectorAll(".scale button");
 for(var k=0;k<bs.length;k++)bs[k].onclick=function(){ans[i]=+this.getAttribute("data-v");i++;i<n?ask():result()};
 document.getElementById("back").onclick=function(){if(i>0){i--;ask()}else home()};
}

function result(){
 var sum={},cnt={},tot=0,j,d;
 for(j=0;j<S.qs.length;j++){d=S.qs[j][0];sum[d]=(sum[d]||0)+ans[j];cnt[d]=(cnt[d]||0)+1;tot+=ans[j]}
 var pc=function(s,c){return Math.round((s-c)/(c*4)*100)};
 var all=pc(tot,S.qs.length),lv;
 done[idx]="ผล "+all+"%";
 for(j=0;j<S.levels.length;j++){if(all<S.levels[j][0]){lv=S.levels[j];break}}
 var rows=S.dims.map(function(x){return{n:x,p:pc(sum[x],cnt[x])}});
 var bars=rows.map(function(r){return '<div class="dim"><div class="row"><span>'+r.n+'</span><span>'+r.p+'%</span></div><div class="bar"><i style="width:'+r.p+'%"></i></div></div>'}).join("");
 var sorted=rows.slice().sort(function(a,b){return a.p-b.p});
 var tips=S.tips[sorted[0].n].concat([S.tips[sorted[1].n][0]]);
 var C=2*Math.PI*74;
 app.innerHTML='<div class="center"><div class="mute">'+S.ic+' ผลชุด '+S.title+'</div><h2>'+lv[1]+'</h2><div class="ring"><svg width="170" height="170" viewBox="0 0 170 170" aria-hidden="true"><circle class="t" cx="85" cy="85" r="74"/><circle class="f" id="f" cx="85" cy="85" r="74" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'"/></svg><b>'+all+'%</b></div><p>'+lv[2]+'</p></div>'+bars+'<h2 style="margin-top:24px;font-size:1.2rem">ลองทำวันนี้</h2><ul>'+tips.map(function(t){return'<li>'+esc(t)+'</li>'}).join("")+'</ul><div class="row-btn"><button class="btn" id="next">เลือกชุดอื่นต่อ</button><button class="btn ghost" id="share">แชร์ผลเป็นรูป</button><button class="btn ghost" id="again">ทำชุดนี้อีกครั้ง</button></div><p class="mute center" style="margin-top:22px"><b>ManassaMai</b><span class="brand-sub">Self care and Holistic Healing workshop</span></p><p class="mute note">แบบทดสอบนี้ใช้เพื่อสะท้อนตัวเอง ไม่ใช่การวินิจฉัย หากรู้สึกหนักใจมาก คุยกับคนที่ไว้ใจหรือผู้เชี่ยวชาญได้ ในไทยโทรสายด่วนสุขภาพจิต 1323 ได้ตลอด 24 ชั่วโมง</p>';
 setTimeout(function(){var f=document.getElementById("f");if(f)f.style.strokeDashoffset=C*(1-all/100)},60);
 document.getElementById("next").onclick=home;
 document.getElementById("again").onclick=function(){ans=[];i=0;ask()};
 var sh=document.getElementById("share");
 sh.onclick=function(){
  var txt="ผลแบบทดสอบ "+S.title+" ของฉัน: "+lv[1]+" ("+all+"%) | ManassaMai";
  shareCard(sh,txt,{label:"ผลชุด "+S.title,head:lv[1]+" ("+all+"%)",lines:[lv[2]]})
 };
 window.scrollTo(0,0);
}

(function(){var p="",c="",go="";try{var u=new URLSearchParams(location.search);p=u.get("set")||"";c=u.get("cat")||"";go=u.get("go")||""}catch(e){}
for(var k=0;k<SETS.length;k++){if(SETS[k].id===p){idx=k;S=SETS[k];ans=[];ord=[];i=0;ask();if(p==="contact"&&go==="shop"&&typeof shopPage==="function")shopPage();return}}
for(var g=0;g<GROUPS.length;g++){if(GROUPS[g].id===c&&GROUPS[g].ids.length){showCat(g);return}}
showHome()})();
</script>
