{e:"🔥",n:"กลับมามีชีวิตชีวา",en:"Aliveness",bg:"rgba(250,170,120,.34),rgba(250,210,130,.26)",

lend:"ความมีชีวิตชีวาของคุณช่วยให้การพักไม่เงียบเหงา และทำให้การจัดระเบียบหรือการเรียนรู้มีสีสัน ลองใส่ความสนุกหรือการสร้างสรรค์ลงไป",

call:["ยอมรับความรู้สึกที่เกิดขึ้นจริง แม้ยังไม่รู้ว่าจะทำยังไงกับมัน","บอกความต้องการเล็ก ๆ ของตัวเองให้ชัดขึ้น","เลือกสิ่งที่สอดคล้องกับสิ่งสำคัญของเรา มากกว่าความคาดหวังของใคร"],
pr:[["ใจ","เขียนสามบรรทัดว่า ตอนนี้ฉันรู้สึก... เพราะ... และฉันอยากได้..."],["ใจ","ฝึกบอกความต้องการเล็ก ๆ หนึ่งอย่างกับใครสักคน เช่น ขอเวลาคิดดูก่อนนะ"],["กาย","วางมือบนอก หายใจช้า ๆ แล้วสังเกตว่าตรงนั้นรู้สึกแน่นหรือโล่ง"],["กาย","เดินช้า ๆ 5 นาทีโดยไม่ฟังอะไร ปล่อยให้ความรู้สึกที่ค้างอยู่ผ่านเข้ามา"],["จิตวิญญาณ","นั่งเงียบ ๆ แล้วถามตัวเองว่า ถ้าไม่มีใครคาดหวังอะไร ฉันอยากเลือกอะไร"]],
rt:["ก่อนเริ่มวัน นั่งลง วางมือบนอก หายใจตามธรรมชาติ 5 รอบ แล้วถามตัวเองว่าตอนนี้ใจฉันรู้สึกยังไง ตอบสั้น ๆ ในใจก็พอ","ระหว่างวัน หยุดสักครู่ แล้วเช็กว่าตอนนี้ฉันกำลังทำเพราะอยากทำ หรือเพราะควรทำ","ก่อนนอน เขียน 3–5 บรรทัดว่าวันนี้อะไรที่ฉันอยากพูดแต่ไม่ได้พูด และอะไรที่ฉันรู้สึกขอบคุณ"],
qn:["ถ้าไม่ต้องทำให้ใครสบายใจ วันนี้ฉันจะพูดอะไร","ความรู้สึกไหนที่ฉันเก็บไว้นานจนชินแล้ว","ตอนนี้ฉันกำลังใช้ชีวิตตามความคาดหวังของใครอยู่บ้าง"],
rm:"คุณไม่ต้องรู้คำตอบของทุกเรื่องในวันนี้ แค่ซื่อสัตย์กับความรู้สึกของตัวเองหนึ่งครั้ง ก็เป็นการกลับมาที่มีความหมายแล้ว",
svc:["Reset to Restart: Elemental Reading: สำรวจธรรมชาติภายใน ความต้องการ และแนวทางออกแบบชีวิตที่สอดคล้องกับตัวเอง"]},
{e:"🌳",n:"กลับมาเชื่อมโยงกับธรรมชาติ",en:"Return to Nature",bg:"rgba(150,190,130,.34),rgba(220,230,180,.26)",
core:"ธรรมชาติไม่จำเป็นต้องเป็นภูเขาหรือป่าไกล ๆ แค่แสงแดด ลม ต้นไม้ หรือการเดินแบบไม่รีบ ก็ช่วยให้เรากลับมาอยู่กับปัจจุบันได้",
a:["ช่วงนี้ชีวิตอาจอยู่กับหน้าจอ ตารางเวลา และความเร่งรีบ มากกว่าจังหวะที่เป็นธรรมชาติของตัวเอง","พอเป็นแบบนี้นาน ๆ ใจเราก็เหมือนไม่มีที่ให้พัก ไม่ใช่เพราะคุณขาดอะไร แต่เพราะสิ่งรอบตัวส่งสัญญาณมาตลอดเวลา","ลองสังเกตดูว่า ครั้งสุดท้ายที่ได้อยู่กับแสงหรือลมข้างนอกโดยไม่ต้องรีบทำอะไรคือเมื่อไร"],
call:["อนุญาตให้ชีวิตช้าลงตามจังหวะของวัน","ได้สัมผัสแสง ลม ต้นไม้ หรือน้ำ ด้วยประสาทสัมผัสจริง ๆ","เลือกความเรียบง่ายที่ช่วยให้ใจได้พัก"],
pr:[["กาย","ยืนหรือนั่งรับแสงเช้า 5–10 นาที โดยไม่ต้องทำอย่างอื่น"],["กาย","เดินเท้าเปล่าบนหญ้าหรือพื้นเย็น ๆ ถ้าปลอดภัย แล้วสังเกตสัมผัสใต้เท้า"],["ใจ","นั่งมองต้นไม้หนึ่งต้น 3 นาที สังเกตสีและการไหวของใบ"],["ใจ","ปิดหน้าจอหนึ่งช่วง เช่นตอนกินข้าว แล้วอยู่กับรสและกลิ่นของอาหาร"],["จิตวิญญาณ","ฟังเสียงรอบตัว 5 อย่าง แล้วขอบคุณหนึ่งสิ่งที่อยู่นอกหน้าต่าง"]],
rt:["หลังตื่นนอน เปิดหน้าต่างหรือออกไปหน้าบ้านสักนาที หายใจตามธรรมชาติ สังเกตแสง ลม และเสียง แล้วถามตัวเองว่าวันนี้อากาศรู้สึกยังไง","ระหว่างวัน มองออกไปไกล ๆ 1–3 นาที สังเกตสีหรือการเคลื่อนไหวของสิ่งเล็ก ๆ ข้างนอก ปล่อยไหล่ลง","ก่อนนอน หรี่ไฟสว่าง เปิดไฟอุ่น ๆ นั่งเงียบ 5 นาที แล้วเขียนหนึ่งบรรทัดว่าวันนี้ธรรมชาติให้อะไรฉันบ้าง"],
qn:["จังหวะของวันนี้ช้าเกินไปหรือเร็วเกินไปสำหรับฉัน","สิ่งเล็ก ๆ อะไรในธรรมชาติที่ทำให้ใจฉันนิ่งลงได้","ถ้าฉันออกไปอยู่ข้างนอกทุกวัน วันละ 10 นาที ชีวิตจะเปลี่ยนไปยังไง"],
rm:"คุณไม่ต้องไปไกลถึงภูเขาหรือป่า ใต้ต้นไม้ต้นเดียวหรือริมหน้าต่างก็เป็นธรรมชาติที่ช่วยได้แล้ว",
svc:["กิจกรรมดูแลตัวเองผ่านธรรมชาติ ประสาทสัมผัส และวิถีชีวิตเรียบง่ายของมะไหม","ทาง LINE OA มีเรียนออนไลน์ + ดาวน์โหลด Self care tool ฟรี"]},
{e:"🌅",n:"กลับมาเชื่อมโยงกับความหมายของชีวิต",en:"Return to Soul",bg:"rgba(250,190,130,.34),rgba(245,220,170,.26)",
core:"เราไม่จำเป็นต้องค้นพบภารกิจใหญ่ของชีวิตทันที บางครั้งการกลับไปทำสิ่งเล็ก ๆ ที่ทำให้รู้สึกมีชีวิตชีวา อาจเป็นจุดเริ่มต้นของการเข้าใจว่าเราอยากใช้ชีวิตแบบไหน",
a:["ช่วงนี้คุณอาจทำหลายอย่างได้ดี แต่เริ่มสงสัยว่าชีวิตที่กำลังสร้างอยู่ตรงกับสิ่งที่สำคัญสำหรับตัวเองหรือเปล่า","คำถามแบบนี้มักมาในช่วงที่เราผ่านอะไรมาเยอะ หรือเริ่มอิ่มกับสิ่งที่เคยตามหา ไม่ได้แปลว่าคุณมาผิดทาง แต่อาจแปลว่าบางส่วนในตัวคุณอยากได้คำตอบที่ลึกกว่าเดิม","ลองสังเกตดูว่า มีสิ่งเล็ก ๆ อะไรที่ทำแล้วใจตื่นขึ้นมา โดยไม่ต้องมีเหตุผลรองรับ"],
call:["กลับไปหาสิ่งเล็ก ๆ ที่ทำให้รู้สึกมีชีวิตชีวา แม้ยังไม่เห็นผลทันที","ลองถามว่าสิ่งสำคัญของฉันตอนนี้คืออะไร ไม่ใช่ของเมื่อห้าปีก่อน","เลือกก้าวเล็ก ๆ ที่สอดคล้องกับคุณค่าของตัวเอง"],
pr:[["กาย","เดินช้า ๆ 10 นาที แล้วสังเกตว่าตรงไหนในร่างกายรู้สึกเบาหรือตื่น"],["กาย","ทำสิ่งหนึ่งด้วยมือ เช่น วาด ทำอาหาร หรือปลูกต้นไม้เล็ก ๆ"],["ใจ","เขียนรายการสิ่งที่ทำให้ฉันลืมเวลา 5 อย่าง แล้วดูว่ามีอะไรซ้ำกัน"],["ใจ","เล่าให้คนที่ไว้ใจฟังว่า ช่วงนี้ฉันสงสัยอะไรในชีวิต"],["จิตวิญญาณ","นั่งเงียบ ๆ 5 นาที แล้วถามว่า ถ้าวันนี้เลือกได้หนึ่งอย่างที่มีความหมายกับฉัน จะเป็นอะไร"]],
rt:["ก่อนเปิดมือถือ นั่งลง หายใจตามธรรมชาติ 5 รอบ แล้วถามตัวเองว่า วันนี้อะไรคือสิ่งเล็ก ๆ ที่อยากให้มีความหมายกับฉัน","ระหว่างวัน หยุดสั้น ๆ แล้วถามว่าสิ่งที่ทำอยู่ตอนนี้ ใกล้หรือไกลจากสิ่งสำคัญของฉัน ไม่ต้องตัดสิน แค่สังเกต","ก่อนนอน เขียนสองบรรทัด บรรทัดแรกคือช่วงไหนของวันที่ใจฉันตื่น บรรทัดสองคือพรุ่งนี้อยากให้ช่วงแบบนั้นเกิดอีกยังไง"],
qn:["ถ้าไม่ต้องพิสูจน์ความสำเร็จกับใคร ฉันอยากสร้างชีวิตแบบไหน","สิ่งไหนที่ฉันเคยรักแต่ปล่อยทิ้งไป โดยไม่มีเหตุผลที่ชัดเจน","ถ้าชีวิตของฉันมีคำหนึ่งคำที่อยากให้เป็นเข็มทิศ คำนั้นคือคำว่าอะไร"],
rm:"คุณไม่ต้องรู้ภารกิจใหญ่ของชีวิตในวันนี้ แค่สังเกตว่าอะไรทำให้ใจตื่น แล้วให้เวลากับมันทีละนิด ก็เป็นการเดินกลับไปหารากแล้ว",
svc:["Reset to Restart: Elemental Reading: สำรวจตัวเอง จังหวะชีวิต คุณค่าที่สำคัญ และบทต่อไปที่อยากสร้าง"]}
]};

qs:[
["ช่วงนี้ ตอนไหนที่ใจคุณสงบที่สุด",[["ได้อยู่กับสิ่งที่กว้าง ๆ ลึก ๆ แล้วใจโล่งขึ้นเอง",2],["ได้หลบเข้าไปอยู่ในที่เงียบ ๆ ที่รู้สึกปลอดภัยและร่มเย็น",3],["ได้อยู่กลางแจ้ง ใจเบา และอยากเล่นหรือหัวเราะ",4],["ได้ปล่อยความรู้สึกหรือเรื่องหนัก ๆ ออกไป แล้วรู้สึกสดชื่นขึ้น",5]]],
["เวลามีเรื่องวุ่นวายเข้ามา ใจคุณกลับมาสงบได้ด้วยวิธีไหน",[["ถอยออกมามองภาพรวมจากที่สูง แล้วค่อยตัดสินใจ",0],["ปล่อยให้เรื่องไหลผ่านไป และปรับตัวไปตามสถานการณ์",1],["ขยับตัว ออกไปรับลม แล้วใจก็เบาลง",4],["ระบายหรือร้องไห้ออกมาให้หมด แล้วค่อยโล่ง",5]]],
["วันหยุดที่ได้พักใจจริง ๆ ของคุณเป็นแบบไหน",[["อยู่ที่สูง ๆ เงียบ ๆ มองไกล ๆ ไม่ต้องคุยกับใคร",0],["เดินเรื่อย ๆ ไปตามทาง ไม่มีแผน ไปถึงไหนก็ได้",1],["นั่งมองความกว้างใหญ่ คิดเรื่องลึก ๆ หรือไม่คิดอะไรเลย",2],["อยู่ในมุมร่มเย็น มีต้นไม้ มีของที่ชอบ ไม่มีใครรบกวน",3]]],
["อะไรทำให้ใจคุณรู้สึกปลอดภัย",[["ความรู้สึกว่าชีวิตยังไหลไปได้ แม้บางช่วงจะช้า",1],["มีที่ซุกตัวที่ไว้ใจ และคนที่ไม่ถามมาก",3],["ความรู้สึกเป็นอิสระ ไม่มีอะไรมากดทับ",4],["ได้วางของหนักลง จนรู้สึกเบาตัว",5]]],
["ตอนเหนื่อยใจ คุณอยากกลับไปหาอะไร",[["ความนิ่งและความมั่นคงที่ไม่เปลี่ยนไปตามอารมณ์ของวัน",0],["พื้นที่ใหญ่พอให้ทุกความรู้สึกอยู่ได้ โดยไม่ต้องจัดการ",2],["มุมสงบที่ได้ฟื้นเงียบ ๆ ไม่ต้องอธิบาย",3],["การได้ล้างทุกอย่างออก แล้วเริ่มใหม่ให้สดชื่น",5]]],
["คนอื่นมักรู้สึกยังไงเวลาอยู่กับคุณ",[["มั่นคง พึ่งพาได้ ไม่หวั่นไหวง่าย",0],["ลื่นไหล คุยง่าย เข้ากับคนได้หลายแบบ",1],["อบอุ่นและลึก เหมือนมีอะไรให้ค้นอีกเยอะ",2],["สดใส เบา ๆ ทำให้บรรยากาศผ่อนคลาย",4]]],
["เวลาอารมณ์ขึ้นลง คุณมักเป็นแบบไหน",[["ปล่อยให้ไหลไปตามธรรมชาติ ไม่ฝืนมัน",1],["ขึ้นลงเหมือนคลื่น แต่ข้างล่างยังลึกและนิ่ง",2],["เปลี่ยนไวตามแสงและลม แต่กลับมาสดใสได้เร็ว",4],["แรงและตรง ๆ ตอนมา แล้วก็เบาโล่งหลังจากนั้น",5]]],
["ถ้าเลือกอยู่ที่ไหนสักแห่งได้หนึ่งชั่วโมง คุณเลือกที่ไหน",[["บนยอดที่ลมแรงและมองได้ไกล",0],["ริมหาดตอนคลื่นเข้าออกช้า ๆ",2],["ใต้ต้นไม้ใหญ่ที่แสงลอดผ่านใบ",3],["กลางทุ่งที่มีดอกไม้และลมเบา ๆ",4]]],
["ลึก ๆ แล้ว ความสงบแบบไหนที่คุณอยากพกไว้ในใจ",[["สงบแบบนิ่งและหนักแน่น ไม่หวั่นไหวง่าย",0],["สงบแบบยืดหยุ่น ไหลผ่านเรื่องต่าง ๆ ไปได้",1],["สงบแบบอบอุ่น ปลอดภัย และค่อย ๆ งอกงาม",3],["สงบแบบสดชื่น ล้างทุกอย่างแล้วเริ่มใหม่ได้",5]]]
],
ps:[
{e:"⛰️",n:"ภูเขา",en:"Mountain",tag:"ความสงบแบบนิ่ง มั่นคง และมองได้ไกล",bg:"rgba(170,175,185,.36),rgba(205,200,190,.28)",
why:"ใจคุณสงบเมื่อมีที่ยืนที่มั่นคง ได้ถอยออกมามองภาพรวม และไม่ต้องหวั่นไหวไปกับทุกเรื่อง ภูเขาไม่ได้เงียบเพราะไม่มีลม แต่เพราะมันยืนอยู่ได้ แม้ลมจะผ่านมาตลอด",
now:"ช่วงนี้คุณอาจกำลังต้องการความมั่นคงในใจมากขึ้น หรือกำลังเป็นหลักให้หลายเรื่องและหลายคน ลองสังเกตดูว่าภูเขาในตัวคุณได้พักบ้างไหม ไม่ต้องแข็งแรงตลอดก็ได้",
ql:["มั่นคง ไม่หวั่นไหวง่าย","มองภาพใหญ่ได้ชัด","พึ่งพาได้","อยู่กับความเงียบได้สบาย"],
gs:{see:"มองไกล ๆ ไปที่เส้นขอบฟ้าหรืออาคารสูงสักแห่ง แล้วนึกถึงภูเขาที่ยืนอยู่เฉย ๆ",hear:"ฟังเสียงลมหรือความเงียบรอบตัว แล้วสังเกตว่าอะไรอยู่นิ่งที่สุด",touch:"ยืนให้เท้าสองข้างแตะพื้นแน่น ๆ แล้วรู้สึกน้ำหนักที่กดลงไป",breath:"หายใจเข้าช้า ๆ ให้หลังตั้งตรง แล้วหายใจออกยาว ๆ เหมือนวางน้ำหนักลงบนพื้น"},
q:"ฉันแบกอะไรไว้เพื่อให้คนอื่นมั่นคง แล้วฉันวางมันลงได้บ้างไหม",
msg:"คุณไม่ต้องเป็นภูเขาให้ใครตลอดเวลานะ แม้ภูเขาเองก็ยังมีวันที่หมอกลงและฝนตก"},
{e:"🏞️",n:"แม่น้ำ",en:"River",tag:"ความสงบแบบไหลลื่น ยืดหยุ่น และปรับตัวได้",bg:"rgba(150,190,200,.36),rgba(190,215,210,.28)",
why:"ใจคุณสงบเมื่อรู้สึกว่าชีวิตยังเคลื่อนไปได้ ไม่ติดอยู่กับที่ และปรับตัวไปตามทางโค้งหรือก้อนหินที่เจอได้ แม่น้ำไม่ต้องรู้ว่าทะเลอยู่ไกลแค่ไหน มันแค่ไหลต่อ",
now:"ช่วงนี้คุณอาจกำลังผ่านการเปลี่ยนผ่านบางอย่าง หรือกำลังเรียนรู้ที่จะปล่อยให้เรื่องไหลผ่าน ลองสังเกตว่ามีตรงไหนที่น้ำในตัวคุณติดอยู่ และอยากได้ทางไหลใหม่",
ql:["ยืดหยุ่น ปรับตัวเก่ง","ปล่อยวางเรื่องที่ควบคุมไม่ได้","เข้ากับคนและสถานการณ์ได้หลากหลาย","เชื่อใจจังหวะของชีวิต"],
gs:{see:"มองน้ำที่ไหล เช่น น้ำจากก๊อก ฝนบนหน้าต่าง หรือแม่น้ำจริงถ้าอยู่ใกล้",hear:"ฟังเสียงน้ำไหลหรือเสียงฝนเบา ๆ แล้วปล่อยความคิดไหลตามไป",touch:"ล้างมือหรือแช่มือในน้ำอุ่นช้า ๆ แล้วสังเกตสัมผัสของน้ำ",breath:"หายใจเข้าออกเป็นจังหวะต่อเนื่องเหมือนน้ำไหล ไม่มีช่วงหยุดให้ฝืน"},
q:"มีอะไรในชีวิตที่อยากให้ไหลต่อ แต่ฉันยังเกร็งกอดไว้อยู่",
msg:"ไม่ต้องรู้ว่าปลายทางคืออะไรก็ได้นะ ขอแค่ไม่ฝืนตัวเองให้หยุดไหล"},
{e:"🌊",n:"ทะเล",en:"Sea",tag:"ความสงบแบบกว้าง ลึก และโอบรับทุกความรู้สึก",bg:"rgba(130,185,210,.36),rgba(175,215,225,.28)",
why:"ใจคุณสงบเมื่อมีพื้นที่ใหญ่พอให้ทุกความรู้สึกอยู่ได้ ผิวน้ำอาจมีคลื่น แต่ข้างล่างลึกและนิ่ง ทะเลไม่ต้องห้ามคลื่นของตัวเอง",
now:"ช่วงนี้คุณอาจรู้สึกอะไรลึก ๆ เยอะ และอยากได้พื้นที่ที่ไม่ต้องอธิบาย ลองให้เวลากับความรู้สึกที่ขึ้นลง โดยไม่รีบสรุปว่ามันดีหรือไม่ดี",
ql:["อ่อนไหวและลึกซึ้ง","โอบรับความรู้สึกได้หลายแบบ","มีโลกภายในกว้าง","ข้างล่างยังนิ่ง แม้ผิวน้ำจะมีคลื่น"],
gs:{see:"มองสิ่งที่กว้าง ๆ เช่น ท้องฟ้า ถนนยาว ๆ หรือผืนน้ำ แล้วปล่อยสายตาให้ไกลที่สุด",hear:"ฟังเสียงคลื่นหรือเสียงหายใจของตัวเอง แล้วสังเกตจังหวะเข้าออก",touch:"วางมือบนอกหรือท้อง แล้วรู้สึกการขยับขึ้นลงเหมือนคลื่น",breath:"หายใจเข้าให้ท้องพองเหมือนคลื่นเข้าฝั่ง แล้วหายใจออกให้ท้องแฟบเหมือนคลื่นถอย"},
q:"ความรู้สึกไหนที่ฉันเก็บไว้ลึก ๆ และอยากให้มีที่ให้มันได้ขึ้นมาหายใจ",
msg:"ความรู้สึกของคุณไม่ได้เยอะเกินไปหรอก แค่ต้องการทะเลที่ใหญ่พอให้มันอยู่ได้"},
{e:"🌲",n:"ป่าไม้",en:"Forest",tag:"ความสงบแบบร่มเย็น ปลอดภัย และค่อย ๆ งอกงาม",bg:"rgba(130,175,130,.36),rgba(190,210,160,.28)",
why:"ใจคุณสงบเมื่อมีที่ร่มให้ซุกตัว ที่ที่ไม่ต้องแสดงอะไรให้ใครเห็น ป่าเติบโตช้า ๆ เงียบ ๆ และหล่อเลี้ยงทุกอย่างใต้ร่มเงา",
now:"ช่วงนี้คุณอาจต้องการพื้นที่ปลอดภัยเพื่อฟื้นและค่อย ๆ งอก ไม่ต้องรีบออกผลก็ได้ ลองให้ตัวเองได้อยู่ในร่มบ้างโดยไม่รู้สึกผิด",
ql:["อบอุ่น เป็นที่พักของคนอื่น","ค่อย ๆ เติบโตอย่างอดทน","ชอบความเป็นส่วนตัว","หล่อเลี้ยงคนรอบตัวอย่างเงียบ ๆ"],
gs:{see:"มองสีเขียวสักอย่าง เช่น ใบไม้ หรือต้นไม้ในกระถาง ให้นานกว่าที่เคยมอง",hear:"ฟังเสียงใบไม้ เสียงนก หรือความเงียบของห้อง แล้วสังเกตว่ามีเสียงเล็ก ๆ อะไรบ้าง",touch:"สัมผัสใบไม้ เปลือกไม้ ดิน หรือผ้าธรรมชาติช้า ๆ",breath:"หายใจเข้าลึก ๆ ดมกลิ่นดิน ใบไม้ หรือชา แล้วหายใจออกช้า ๆ"},
q:"ฉันอยากมีมุมร่มเย็นแบบไหนในชีวิต และอะไรทำให้ฉันยังไม่ให้มุมนั้นกับตัวเอง",
msg:"ต้นไม้ไม่ได้โตให้เห็นทุกวัน แต่รากของมันลงลึกอยู่เสมอ คุณก็เหมือนกันนะ"},
{e:"🌼",n:"ทุ่งดอกไม้",en:"Meadow",tag:"ความสงบแบบโล่ง เบา และสดใส",bg:"rgba(245,215,120,.36),rgba(225,230,160,.28)",
why:"ใจคุณสงบเมื่อได้อยู่กลางแจ้ง ไม่มีอะไรกดทับ ได้เบาและได้เล่น ทุ่งดอกไม้ไม่ได้ตั้งใจจะสวย มันแค่เปิดรับแสงและลม",
now:"ช่วงนี้คุณอาจต้องการพื้นที่เบา ๆ ที่ไม่ต้องจริงจัง หรืออยากให้ความสดใสกลับมาในชีวิต ลองให้ใจได้เล่นบ้าง แม้เป็นเรื่องเล็ก ๆ",
ql:["สดใส ทำให้บรรยากาศเบา","เปิดรับสิ่งใหม่ได้ง่าย","กลับมามีชีวิตชีวาได้เร็ว","สนุกกับสิ่งเล็ก ๆ รอบตัว"],
gs:{see:"มองดอกไม้หรือสีสันสักอย่าง แล้วเลือกสีที่ชอบที่สุด",hear:"เปิดหน้าต่างแล้วฟังเสียงลมพัดและเสียงรอบตัว",touch:"ให้ผิวสัมผัสลมและแสงแดดอ่อน ๆ หรือเดินเท้าเปล่าบนพื้นหญ้าถ้าปลอดภัย",breath:"หายใจเข้ารับอากาศใหม่ แล้วหายใจออกพร้อมยิ้มบาง ๆ"},
q:"ถ้าไม่ต้องจริงจัง วันนี้ฉันอยากเล่นอะไรกับชีวิต",
msg:"ความเบาไม่ใช่ความไม่จริงจังนะ บางครั้งมันคือวิธีที่หัวใจใช้พักให้เต็มที่"},
{e:"💧",n:"น้ำตก",en:"Waterfall",tag:"ความสงบแบบสดชื่น ปล่อยวาง และเริ่มใหม่ได้",bg:"rgba(140,200,205,.36),rgba(200,230,225,.28)",
why:"ใจคุณสงบเมื่อได้ปล่อยของหนักลงจริง ๆ น้ำตกไม่เก็บน้ำไว้ มันปล่อยลงมา แล้วสายน้ำก็ใหม่ทุกวินาที",
now:"ช่วงนี้คุณอาจมีบางเรื่องที่อยากปล่อยออกไป หรืออยากรู้สึกสดชื่นขึ้นหลังจากแบกอะไรมานาน ลองหาทางให้ความรู้สึกได้ไหลลงบ้าง แทนการเก็บไว้ในตัว",
ql:["ตรงไปตรงมาและจริงใจ","ปล่อยวางแล้วกลับมาสดชื่นได้เร็ว","มีพลังชำระล้างและเริ่มใหม่","กล้าปล่อยสิ่งที่หมดหน้าที่ไปแล้ว"],
gs:{see:"มองน้ำที่ไหลแรง ๆ เช่น น้ำจากฝักบัว หรือคลิปน้ำตก แล้วปล่อยสายตาตามสายน้ำลง",hear:"ฟังเสียงน้ำตกหรือเสียงฝักบัว แล้วนึกว่าเสียงนั้นพัดเรื่องหนัก ๆ ออกไปด้วย",touch:"ล้างหน้าด้วยน้ำเย็น หรืออาบน้ำช้า ๆ แล้วรู้สึกน้ำไหลผ่านไหล่",breath:"หายใจออกแรง ๆ ผ่านปากหนึ่งครั้งเหมือนปล่อยน้ำลงมา แล้วหายใจเข้าช้า ๆ"},
q:"ฉันกำลังแบกอะไรที่หมดหน้าที่ไปแล้วแต่ยังไม่ยอมปล่อย",
msg:"การปล่อยไม่ได้แปลว่าไม่แคร์นะ มันแปลว่าคุณเลือกให้ตัวเองได้เบาลง"}
]};

tag:"ไม่ผิดที่ยังไม่แน่ใจ ลองเริ่มจากสิ่งเล็ก ๆ ที่ทำให้ใจตื่น",
cur:"ช่วงนี้คุณอาจไม่แน่ใจว่าตัวเองต้องการอะไร รู้สึกไม่ค่อยมีชีวิตชีวา และไม่ค่อยทันสังเกตว่าชีวิตตอนนี้เหมาะกับเราหรือเปล่า การใช้ชีวิตตามความคาดหวังมานานอาจทำให้เสียงของตัวเองเบาลง ไม่ได้แปลว่ามันหายไป",
body:"ลองสังเกตว่าร่างกายรู้สึกเบาหรือหนักตอนทำกิจกรรมแต่ละอย่าง และตอนไหนที่ตื่นขึ้นมาเองโดยไม่ต้องฝืน เป็นเพียงสิ่งที่ลองสังเกต ไม่ใช่การวินิจฉัย",
mind:"ความเชื่อแบบ “ฉันควรรู้ว่าต้องการอะไร” หรือ “ทำตามที่ควรจะปลอดภัยกว่า” อาจทำให้เรายิ่งห่างจากตัวเอง ลองให้ตัวเองได้ตอบว่า “ยังไม่รู้” โดยไม่ต้องรีบหาคำตอบ",
life:"ชีวิตประจำวันที่มีแต่หน้าที่ ขาดช่วงเวลาอยู่กับตัวเอง และสภาพแวดล้อมที่เคยชินกับการทำตามความคาดหวัง อาจทำให้ความต้องการของเราเงียบลงไปเรื่อย ๆ",
bms:"ลองสำรวจว่าตอนไหนที่ร่างกายผ่อนลงเอง ใจอยากรู้อยากลอง หรือรู้สึกมีความหมายเล็ก ๆ สัญญาณเหล่านี้อาจเป็นเข็มทิศอ่อน ๆ ให้เรา",
el:"ในกรอบแพทย์แผนจีน ความมีชีวิตชีวาและการเชื่อมโยงมักถูกเปรียบกับธาตุไฟ และความมั่นคงกับธาตุดิน ลองใช้เป็นคำถามว่า อะไรทำให้ไฟข้างในฉันลุกขึ้น และอะไรทำให้ฉันรู้สึกมั่นคง",
back:"เริ่มจากการสำรวจสิ่งที่ทำให้รู้สึกมีชีวิตชีวา และสิ่งที่ทำให้หมดพลัง แล้วสร้างช่วงเวลาสั้น ๆ อยู่กับตัวเองในแต่ละวัน",
rit:["เช้า (3 นาที) ถามตัวเองหนึ่งคำถาม วันนี้ฉันอยากให้อะไรเกิดขึ้นแม้เพียงเล็กน้อย","กลางวัน (3 นาที) หยุดสั้น ๆ แล้วเช็กว่าตอนนี้ฉันเบาหรือหนัก ตอนนี้กำลังทำอะไรอยู่","ก่อนนอน (10 นาที) จดหนึ่งอย่างที่ทำให้ใจตื่นวันนี้ และหนึ่งอย่างที่ทำให้หมดแรง"],
jr:["ถ้าไม่มีใครคาดหวังอะไรจากฉัน วันนี้ฉันจะทำอะไรเป็นอย่างแรก","สิ่งไหนที่ฉันเคยชอบ แต่หยุดทำไปโดยไม่รู้ตัว","ตอนไหนในสัปดาห์ที่แล้วที่ฉันรู้สึกเป็นตัวเองมากที่สุด","ฉันทำตามความคาดหวังของใครมากที่สุด และฉันเต็มใจแค่ไหน","ถ้าฉันยังไม่ต้องรู้คำตอบ ฉันอยากลองสำรวจเรื่องอะไรก่อน"],

 app.innerHTML='<div class="mute">'+S.ic+' '+S.title+'</div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+i+'"><i style="width:'+pct+'%"></i></div><div class="mute">ข้อ '+(i+1)+' จาก '+n+'</div><div class="q"><h2>'+esc(q[0])+'</h2><div class="opts">'+h+'</div></div><button class="btn ghost" id="back">'+(i>0?'ย้อนกลับ':'กลับไปเลือกชุด')+'</button>';
 var bs=app.querySelectorAll(".opt");
 for(var k=0;k<bs.length;k++)bs[k].onclick=function(){ans[i]=+this.getAttribute("data-f");i++;i<n?askPick():resultPick()};
 document.getElementById("back").onclick=function(){if(i>0){i--;askPick()}else home()};
}

function resultPick(){
 var c=[0,0,0,0],j;
 for(j=0;j<ans.length;j++)c[ans[j]]++;
 var r=[0,1,2,3].sort(function(a,b){return c[b]-c[a]||a-b});
 var F=S.flowers[r[0]],sec=c[r[1]]>=2?S.flowers[r[1]]:null;
 done[idx]='ได้ '+F.n;
 var blk=function(t,x){return '<div class="blk"><div class="blt">'+t+'</div><p>'+x+'</p></div>'};
 app.innerHTML='<div class="center"><div class="mute">'+S.ic+' ผลชุด '+S.title+'</div><div class="big">'+F.e+'</div><div class="mute">ตอนนี้คุณคือ</div><h2>'+F.n+'</h2>'+(sec?'<p class="mute">และมีกลิ่นอายของ '+sec.e+' '+sec.n+' อยู่ด้วย</p>':'')+'</div>'+blk('ตอนนี้ใจคุณเป็นแบบนี้',F.now)+blk('ที่ที่คุณจะเติบโตได้ดี',F.place)+blk('ความต้องการที่แท้จริงของจิตวิญญาณ',F.soul)+'<h2 style="margin-top:24px;font-size:1.2rem">ลองทำวันนี้</h2><ul>'+F.tips.map(function(t){return'<li>'+t+'</li>'}).join("")+'</ul><div class="row-btn"><button class="btn" id="next">เลือกชุดอื่นต่อ</button><button class="btn ghost" id="share">แชร์ผลเป็นรูป</button><button class="btn ghost" id="again">ทำชุดนี้อีกครั้ง</button></div><p class="mute center" style="margin-top:22px"><b>ManassaMai</b><span class="brand-sub">Self care and Holistic Healing workshop</span></p><p class="mute note">ผลนี้เป็นภาพเปรียบเทียบเพื่อความสนุกและให้ลองสะท้อนใจตัวเอง ไม่ใช่การวินิจฉัย หากรู้สึกหนักใจมาก คุยกับคนที่ไว้ใจหรือผู้เชี่ยวชาญได้ ในไทยโทรสายด่วนสุขภาพจิต 1323 ได้ตลอด 24 ชั่วโมง</p>';
 document.getElementById("next").onclick=home;
 document.getElementById("again").onclick=function(){ans=[];ord=[];i=0;askPick()};
 var sh=document.getElementById("share");
 sh.onclick=function(){
  var txt="ตอนนี้ฉันคือ "+F.e+" "+F.n+" | ManassaMai";
  shareCard(sh,txt,{label:"ตอนนี้ฉันคือ",head:F.e+" "+F.n,lines:[F.now]})
 };
 window.scrollTo(0,0);
}

function ask(){
 if(S.contact)return contact();
 if(S.peace)return peaceIntro();
 if(S.bys)return bysIntro();
 if(S.spark)return sparkIntro();
 if(S.rooted)return rootedIntro();
 if(S.nourish)return nourishIntro();
 if(S.seasons)return seasonsIntro();
 if(S.feedback)return feedbackPage();
 if(S.body)return bodyIntro();
 if(S.pick)return askPick();
 var n=S.qs.length,pct=Math.round(i/n*100),btns="";
 for(var v=1;v<=5;v++)btns+='<button data-v="'+v+'" class="'+(ans[i]===v?"on":"")+'" aria-label="'+v+'">'+v+'</button>';
 app.innerHTML='<div class="mute">'+S.ic+' '+S.title+'</div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+i+'"><i style="width:'+pct+'%"></i></div><div class="mute">ข้อ '+(i+1)+' จาก '+n+'</div><div class="q"><h2>'+esc(S.qs[i][1])+'</h2><div class="scale">'+btns+'</div><div class="ends"><span>ไม่เลย</span><span>เป็นประจำ</span></div></div><button class="btn ghost" id="back">'+(i>0?'ย้อนกลับ':'กลับไปเลือกชุด')+'</button>';
 var bs=app.querySelectorAll(".scale button");
 for(var k=0;k<bs.length;k++)bs[k].onclick=function(){ans[i]=+this.getAttribute("data-v");i++;i<n?ask():result()};
 document.getElementById("back").onclick=function(){if(i>0){i--;ask()}else home()};
}

function result(){
 var sum={},cnt={},tot=0,j,d;
 for(j=0;j<S.qs.length;j++){d=S.qs[j][0];sum[d]=(sum[d]||0)+ans[j];cnt[d]=(cnt[d]||0)+1;tot+=ans[j]}
 var pc=function(s,c){return Math.round((s-c)/(c*4)*100)};
 var all=pc(tot,S.qs.length),lv;
 done[idx]="ผล "+all+"%";
 for(j=0;j<S.levels.length;j++){if(all<S.levels[j][0]){lv=S.levels[j];break}}
 var rows=S.dims.map(function(x){return{n:x,p:pc(sum[x],cnt[x])}});
 var bars=rows.map(function(r){return '<div class="dim"><div class="row"><span>'+r.n+'</span><span>'+r.p+'%</span></div><div class="bar"><i style="width:'+r.p+'%"></i></div></div>'}).join("");
 var sorted=rows.slice().sort(function(a,b){return a.p-b.p});
 var tips=S.tips[sorted[0].n].concat([S.tips[sorted[1].n][0]]);
 var C=2*Math.PI*74;
 app.innerHTML='<div class="center"><div class="mute">'+S.ic+' ผลชุด '+S.title+'</div><h2>'+lv[1]+'</h2><div class="ring"><svg width="170" height="170" viewBox="0 0 170 170" aria-hidden="true"><circle class="t" cx="85" cy="85" r="74"/><circle class="f" id="f" cx="85" cy="85" r="74" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'"/></svg><b>'+all+'%</b></div><p>'+lv[2]+'</p></div>'+bars+'<h2 style="margin-top:24px;font-size:1.2rem">ลองทำวันนี้</h2><ul>'+tips.map(function(t){return'<li>'+esc(t)+'</li>'}).join("")+'</ul><div class="row-btn"><button class="btn" id="next">เลือกชุดอื่นต่อ</button><button class="btn ghost" id="share">แชร์ผลเป็นรูป</button><button class="btn ghost" id="again">ทำชุดนี้อีกครั้ง</button></div><p class="mute center" style="margin-top:22px"><b>ManassaMai</b><span class="brand-sub">Self care and Holistic Healing workshop</span></p><p class="mute note">แบบทดสอบนี้ใช้เพื่อสะท้อนตัวเอง ไม่ใช่การวินิจฉัย หากรู้สึกหนักใจมาก คุยกับคนที่ไว้ใจหรือผู้เชี่ยวชาญได้ ในไทยโทรสายด่วนสุขภาพจิต 1323 ได้ตลอด 24 ชั่วโมง</p>';
 setTimeout(function(){var f=document.getElementById("f");if(f)f.style.strokeDashoffset=C*(1-all/100)},60);
 document.getElementById("next").onclick=home;
 document.getElementById("again").onclick=function(){ans=[];i=0;ask()};
 var sh=document.getElementById("share");
 sh.onclick=function(){
  var txt="ผลแบบทดสอบ "+S.title+" ของฉัน: "+lv[1]+" ("+all+"%) | ManassaMai";
  shareCard(sh,txt,{label:"ผลชุด "+S.title,head:lv[1]+" ("+all+"%)",lines:[lv[2]]})
 };
 window.scrollTo(0,0);
}

(function(){var p="",c="";try{var u=new URLSearchParams(location.search);p=u.get("set")||"";c=u.get("cat")||""}catch(e){}
for(var k=0;k<SETS.length;k++){if(SETS[k].id===p){idx=k;S=SETS[k];ans=[];ord=[];i=0;ask();return}}
for(var g=0;g<GROUPS.length;g++){if(GROUPS[g].id===c&&GROUPS[g].ids.length){showCat(g);return}}
showHome()})();
</script>
